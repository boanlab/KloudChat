<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Faces the exports name (deck_export, design CSS) mapped to installed ones;
     without these fontconfig falls back to DejaVu, which has no Hangul. -->
<fontconfig>
  <alias binding="same"><family>맑은 고딕</family><prefer><family>Pretendard</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>Pretendard</family></prefer></alias>
  <alias binding="same"><family>바탕</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>Batang</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family></prefer></alias>
</fontconfig>
