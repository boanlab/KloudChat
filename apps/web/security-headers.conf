# Headers for every page and file this server answers. nginx drops inherited add_header
# lines in a location that sets its own, so nginx.conf includes this file in each of those;
# `vite preview` serves the same lines, so the e2e suite runs under them (vite.config.ts).
#
# Content-Security-Policy, and why each loose part is there:
# - script-src 'unsafe-inline' https:, style-src 'unsafe-inline' https: — an artifact's HTML
#   preview and the template pager are `srcdoc` frames, which inherit this page's policy;
#   model-written pages carry inline scripts and styles and often a library or a font from a
#   CDN. The app's own bundle needs neither, and no part needs eval.
# - style-src 'unsafe-inline' — mermaid and Paged.js also insert <style> elements.
# - img-src/media-src https: — reports and answers show pictures from the web.
# - blob: — previews of PDFs and generated files, and the page view's sheet, which Paged.js
#   fetches (connect-src); data: — inline pictures and fonts.
# - base-uri is left open: a preview adds <base href="about:srcdoc"> to keep its #links in place.
# frame-ancestors is a separate header in nginx.conf: the embed page names other sites there.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' blob: https:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' blob: data:; frame-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The microphone is the composer's dictation; nothing asks for the camera or location.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
