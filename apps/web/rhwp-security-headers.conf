# Headers for /rhwp/, the HWP editor (rhwp-studio, built by rhwp/build-studio.sh) that the
# app's HWP panel frames. Its own policy, not the app's: it adds 'wasm-unsafe-eval', which
# compiling the editor's WebAssembly needs, and is tighter everywhere else: no inline or
# remote script, no remote font, picture or connection, so a document opened here stays on
# this site. Inline styles: the studio's markup carries style attributes. Only this app may
# frame it. `vite preview` serves these lines for /rhwp/ too (vite.config.ts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
