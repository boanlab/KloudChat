<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b53e8" />
    <title>KloudChat · 오프라인</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.25rem; opacity: 0.75; line-height: 1.5; }
      a {
        display: inline-block;
        padding: 0.55rem 1.1rem;
        border-radius: 0.6rem;
        background: #5b53e8;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷에 연결되어 있지 않습니다</h1>
      <p>연결되면 다시 열어 주세요. <span lang="en">You are offline; reopen once connected.</span></p>
      <a href="/">다시 열기</a>
    </main>
  </body>
</html>
