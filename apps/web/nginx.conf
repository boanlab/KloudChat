server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The application bundle is mostly JavaScript and CSS. Shipping it verbatim
  # cost about 1.18 MB on a cold visit; nginx can reduce the same bytes to
  # roughly a quarter before they cross a campus or mobile network.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA fallback: anything that is not a known file becomes index.html. This is
  # the only rule keeping a reloaded /s/<id> from returning 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Only content-hashed assets are cached long-term. index.html never is —
  # otherwise a deploy leaves documents pointing at the previous bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Not in nginx's mime table, and the install prompt reads the type.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # /api  the API the app itself uses
  # /llm  the path external tools such as coding agents use to reach models
  #
  # Both go to the same backend with identical streaming settings, so they
  # share one block — split apart, only one of them gets fixed.
  # Who the client actually is, when something else answers the internet.
  #
  # This container is usually not the edge: a reverse proxy in front terminates
  # TLS and forwards here, so `$remote_addr` is that proxy and every audit row,
  # share visit and 접속기록 line reads as the same internal address. These
  # directives tell nginx to take the client from `X-Forwarded-For` instead —
  # but only when the request came from a network we put there ourselves.
  #
  # `real_ip_recursive on` walks the header back past every trusted hop, so a
  # chain of two proxies still lands on the browser rather than on the inner
  # one. Hops from anywhere else are left alone, which is the part that makes
  # this safe: a client cannot promote its own forged header.
  #
  # The ranges are the private ones plus loopback — enough for a proxy on the
  # same host, the same Docker network, or the same LAN. An edge proxy on a
  # public address needs its address added here, or the header it sends is
  # ignored and this is back where it started.
  #
  # The proxy in front must actually send the header. nginx: `proxy_set_header
  # X-Forwarded-For $proxy_add_x_forwarded_for;` — without it there is nothing
  # here to read, and no configuration on this side can invent it.
  # Narrow it with KCHAT_TRUSTED_PROXIES where the network is shared: every
  # address in this set can name itself anything, so on a LAN where people can
  # reach this port directly, the default set means a sign-in can be recorded
  # against an address its owner picked. One line per proxy is the tight
  # version — `set_real_ip_from 10.1.2.3;`.
  ${KCHAT_TRUSTED_PROXIES}
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location ~ ^/(api|llm)/ {
    # Docker's embedded DNS, re-consulted every 10s. A literal hostname in
    # proxy_pass is resolved ONCE at config load and cached for the life of the
    # worker, so recreating kloudchat-api (new container IP) leaves nginx dialling
    # the dead address and every /api/ call 502s until the web container restarts
    # too. Resolving through a variable forces re-resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kchat_api ${KCHAT_API_URL};
    # $request_uri is required with a variable upstream: nginx no longer appends
    # the matched location automatically.
    proxy_pass $kchat_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # `$remote_addr`, not `$proxy_add_x_forwarded_for`, and the realip block
    # above is why. Appending would carry through whatever the *client* sent in
    # `X-Forwarded-For`, which anybody can set — and the API reads the first
    # hop, so a sign-in could be recorded against an address its owner chose.
    # After realip, `$remote_addr` is the real client and nothing else is.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE: answers arrive token by token. Buffering makes them appear all at
    # once, and a short read timeout truncates long ones mid-sentence.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding on;
  }

  client_max_body_size 64m;
}
