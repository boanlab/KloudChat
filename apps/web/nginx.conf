# The embed page's frame-ancestors, as the API answered for that bot; never empty, since an
# empty `frame-ancestors` would let any site frame it.
map $kchat_frame_ancestors $kchat_frame_policy {
  ""      "'self'";
  default $kchat_frame_ancestors;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The bundle is mostly JS/CSS; gzip cuts it to roughly a quarter.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Only this app may frame its pages (clickjacking). Repeated in every location that
  # sets its own add_header, since nginx drops inherited ones there.
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # SPA fallback: unknown paths serve index.html (a reloaded /s/<id> must not 404).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Only content-hashed assets are cached long-term; index.html never is, or a
  # deploy leaves clients on the previous bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # A published bot framed on the sites an administrator approved for it: only this page
  # gets another frame-ancestors, read from the API per request, and no X-Frame-Options
  # (it cannot name other sites). Every other page keeps 'self' above.
  location ^~ /embed/b/ {
    auth_request /_kchat_frame_policy;
    auth_request_set $kchat_frame_ancestors $upstream_http_x_frame_ancestors;
    add_header Content-Security-Policy "frame-ancestors $kchat_frame_policy" always;
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }

  location = /_kchat_frame_policy {
    internal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kchat_api ${KCHAT_API_URL};
    proxy_pass $kchat_api/api/embed/frame-policy;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # In a subrequest, $request_uri is the page asked for: /embed/b/<slug>.
    proxy_set_header X-Original-URI $request_uri;
  }

  # The loader another site includes; it draws a button and the frame above.
  location = /embed/widget.js {
    add_header Cache-Control "public, max-age=300";
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # Not in nginx's mime table, and the install prompt reads the type.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # Client address from X-Forwarded-For, honoured only for hops from a trusted
  # proxy range (private ranges + loopback by default; every address in the set
  # can claim any client address). Narrow with KCHAT_TRUSTED_PROXIES on a shared
  # LAN, e.g. `set_real_ip_from 10.1.2.3;`. The proxy in front must send the header.
  ${KCHAT_TRUSTED_PROXIES}
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # /api: the app's own API. /llm: what external tools use to reach models.
  # Same backend, same streaming settings, one block.
  location ~ ^/(api|llm)/ {
    # Variable upstream re-resolved via Docker DNS every 10s; a literal hostname
    # is resolved once at load and 502s after the API container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kchat_api ${KCHAT_API_URL};
    # Required with a variable upstream: nginx no longer appends the matched location.
    proxy_pass $kchat_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # `$remote_addr`, not `$proxy_add_x_forwarded_for`: after realip it is the
    # real client, and appending would forward a client-forged header.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE: no buffering, long read timeout.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding on;
  }

  client_max_body_size 64m;
}
