[project]
name = "kchat-api"
version = "0.1.0"
description = "kchat backend — auth, sessions, jobs, artifacts, and the only process that holds the LiteLLM master key"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "email-validator>=2.2",
    # HTML5 parser behind `design_templates.sanitise`; a browser-grade parse, not a regex.
    "nh3>=0.2",
    "python-multipart>=0.0.20",
    "pypdf>=5.1",
    # `.hwp` OLE container reader; `.hwpx` is a plain XML zip.
    "olefile>=0.47",
    "cryptography>=44.0",
    # Hanja → Hangul (services/hangul.py). Pure Python.
    "hanja>=0.15",
    # Report export. reportlab ships CID fonts, so Korean renders without a TTF.
    "python-docx>=1.1",
    "reportlab>=4.2",
    # Deck export.
    "python-pptx>=1.0",
    # MaxMind DB reader, local file only. Inert until GEOIP_DATABASE is set.
    "geoip2>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

# `alembic/` sits beside `app/`; setuptools refuses to guess between two top-level dirs.
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's dependency defaults are function calls by design.
extend-ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations.
"alembic/versions/*" = ["E501"]
# Prompt templates: wrapping a triple-quoted string changes what the model is sent.
"app/services/report.py" = ["E501"]
# OWPML (.hwpx) literals: a line break inside an attribute list breaks the document.
"app/services/report_export.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
