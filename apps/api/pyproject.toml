[project]
name = "kchat-api"
version = "0.1.0"
description = "kchat backend — auth, sessions, jobs, artifacts, and the only process that holds the LiteLLM master key"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    "pypdf>=5.1",
    # 한글 문서. `.hwpx` 는 XML zip 이라 표준 라이브러리만으로 읽는다. `.hwp` 는 OLE
    # 복합 파일이라 컨테이너 판독에만 olefile 을 쓰고, 레코드 해석은 직접 한다.
    "olefile>=0.47",
    "cryptography>=44.0",
    # 한자 독음. 모델이 한국어 문장에 흘리는 중국어 한자를 한글로 되돌리는 데만
    # 쓴다 — services/hangul.py. 표 하나짜리 순수 파이썬이라 시스템 의존성이 없다.
    "hanja>=0.15",
    # Report export. reportlab over a HTML→PDF engine: it needs no system
    # libraries and ships CID fonts, so Korean renders without shipping a TTF.
    "python-docx>=1.1",
    "reportlab>=4.2",
    # Deck export. The .pptx part is a zip of OOXML like .hwpx, but the slide
    # part relationships and layout inheritance are enough machinery that hand-
    # rolling it would be a second exporter to maintain, not a shortcut.
    "python-pptx>=1.0",
    # Reads a MaxMind DB file from disk. No network: the alternative is posting
    # every visitor's address to a lookup service, which is not something this
    # product should do in the background. Inert until GEOIP_DATABASE points at
    # a file — see services/geoip.py.
    "geoip2>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

# `app` is the package; `alembic/` sits beside it as a migration script tree the
# container runs in place. Without this, setuptools sees two top-level
# directories in a flat layout and refuses to guess between them.
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's dependency defaults are function calls by design.
extend-ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by `alembic revision --autogenerate`; reformatting them by hand
# means the next generated file conflicts with the last hand-edited one.
"alembic/versions/*" = ["E501"]
# Prompt templates. The long lines are inside triple-quoted strings, so wrapping
# them changes what is sent to the model rather than how the file reads.
"app/services/report.py" = ["E501"]
# OWPML (.hwpx) literals. Same reason, with less room for argument: Hancom
# Office parses these XML fragments, and a line break inside an attribute list
# is a document that will not open.
"app/services/report_export.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
