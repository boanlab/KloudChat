# Genre shape rules (`services/report.py`): matched in this order on the person's instruction,
# the first that matches given to the outline and the draft.
#
# An entry is either a rule of its own (`match`: a pattern on the instruction, `rule`: the
# text), or `format = "<doc_formats id>"`: the rule the template bound to that format carries in its
# `genre.md`, matched on the same words `doc_formats` reads (case-insensitive). A template picked
# for the document (shipped or a person's) gives its own rule directly and skips this list.

[[genres]]
id = "peer-review"
match = '피어\s{0,3}리뷰|peer\s{0,3}review|리뷰어|심사\s{0,3}(?:의견|보고)|프로그램\s{0,3}위원|메타\s{0,3}리뷰'
rule = '''Genre: 학회 피어리뷰. This evaluates a manuscript — do not rewrite it or make tables or figures it does not have. Strengths and weaknesses as numbered lists — each item opens with its point as one bold sentence, then the grounds. Weaknesses in order of importance, each saying which section or claim of the manuscript is at fault and how to fix it. Always cover novelty (the difference from the closest prior work) and the soundness of the method (threat-model assumptions, fairness of baselines, adaptive attacks, metrics and statistics). If the manuscript says it is pre-experiment, do not mark it down merely for having no results; judge whether the design can answer the question. Make questions specific enough for the authors to answer.'''

[[genres]]
id = "paper"
match = '논문\s{0,3}초안|논문을\s{0,3}써|투고|학회\s{0,3}논문|워크숍\s{0,3}논문|paper\s{0,3}draft'
rule = '''Genre: 학술 논문 초안. Sections in the order the request gives. In related work cite only confirmed real papers, with authors and year, and say in one sentence per work how it differs from this paper. Use tables only for the experimental design and the results frame; related work, threat model and method are prose. If the experiments are not done yet, do not describe results — write hypotheses and plans, and leave the results table empty as 「실험 예정」. The references are the list of papers cited in the text — no unconfirmed bibliographic entries. Register: 「~다」 throughout (「제안한다」, 「필요하다」), never 「~합니다」.'''

[[genres]]
id = "term-report"
match = '리포트|레포트|기말\s{0,3}(?:과제|보고서)|중간\s{0,3}(?:과제|보고서)|과제\s{0,3}보고서|에세이'
rule = '''Genre: 대학 과제 리포트. State the thesis in one sentence at the end of the introduction; each body section develops one strand of that thesis with evidence — do not just list theories. Cite studies, books and sources from the material in the text as (저자 연도), and collect them in the references at the end as 「저자 (연도). 『제목』. 출판사.」. Write no bibliographic entries, page numbers or quotations the material does not give. The conclusion restates the thesis and ends with one open question. Register: 「~다」 throughout (「제안한다」, 「필요하다」), never 「~합니다」.'''

[[genres]]
id = "research-plan"
match = '연구\s{0,3}계획서|조사\s{0,3}계획서|연구\s{0,3}제안서'
rule = '''Genre: 연구·조사 계획서. The research has not been done, so write no results. Number research questions and hypotheses like RQ1·H1; method in the order sample, instruments, procedure, analysis; variables and items as tables. Cite prior surveys and studies from the material as (기관 또는 저자 연도) and collect them in the references. Statistics only as the material gives them, with the source year. Register: 「~다」 throughout (「제안한다」, 「필요하다」), never 「~합니다」.'''

[[genres]]
format = "internal_draft"

