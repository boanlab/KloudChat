# 사내 브리핑: a deck that shortens a meeting. Chosen when the request says so
# (`services/patterns.py`); never shown as a picker.
name = "사내 브리핑"
words = "브리핑|주간\\s{0,2}(?:회의|보고)|현황\\s{0,2}보고|진행\\s{0,2}(?:상황|현황)|킥오프|팀\\s{0,2}회의|운영\\s{0,2}회의"
rules = """
- The first slide states what is decided today, in one line. If nothing is to be decided, say it is a briefing.
- Keep what is decided apart from what is still to be decided.
- Show progress as a table of 항목·상태·담당; for 상태 write how far it has got, not 「진행 중」.
- Do not hide blockers: say what blocks each one and who can unblock it.
- The last slide lists owners and deadlines.
- At most eight slides.
"""
checks = [
  "첫 장에 오늘 정할 것이 한 줄로 있는가.",
  "정해진 것과 정할 것이 갈라져 있는가.",
  "막힌 일마다 무엇이 막고 누가 풀 수 있는지 있는가.",
  "마지막 장이 담당과 기한인가.",
]
