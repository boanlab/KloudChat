# 제안 발표: problem → approach → evidence → request, for reviewers who approve or not.
name = "제안 발표"
words = "제안|피치|pitch|투자\\s{0,2}(?:유치|설명)|사업\\s{0,2}(?:계획|설명)|공모|지원\\s{0,2}사업|IR\\b"
rules = """
- Order it problem → approach → evidence → request.
- Slide titles are noun phrases of at most 16 characters; read alone they show the skeleton (현황 / 무엇이 달라지는가 / 근거 / 요청).
- Compare current and proposed side by side on the same items, and state honestly what works now.
- Every value set as evidence says on the next line what was counted and when; never invent a figure.
- The last slide is the request: what is needed, who decides, by when; gather cost, headcount and duration there.
"""
checks = [
  "문제가 해결책보다 먼저 서 있는가.",
  "장 제목만 읽어도 제안의 뼈대가 서는가.",
  "근거 값마다 무엇을 언제 센 것인지 있는가.",
  "마지막 장이 누가, 무엇을, 언제까지 정할지 밝힌 요청인가.",
]
