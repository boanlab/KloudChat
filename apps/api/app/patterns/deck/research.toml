# 연구·논문 발표: chosen from the request (`services/patterns.py`); never shown as a picker.
order = 20
name = "연구·논문 발표"
name_en = "Research or paper talk"
words = '''논문\s{0,2}(?:발표|리뷰|소개|세미나)|랩\s{0,2}(?:세미나|미팅)|연구실\s{0,2}세미나|저널\s{0,2}클럽|학회\s{0,2}발표|연구\s{0,2}(?:발표|성과\s{0,2}발표)|(?<![A-Za-z])paper (?:talk|review|presentation)(?![A-Za-z])|(?<![A-Za-z])journal club(?![A-Za-z])|(?<![A-Za-z])lab seminar(?![A-Za-z])|(?<![A-Za-z])conference talk(?![A-Za-z])|(?<![A-Za-z])research talk(?![A-Za-z])'''
rules = """- The first slide names the paper or study: title, authors, venue and year, as the material gives them; a missing one is a bracket blank.
- Problem and motivation before the method; say what was hard before this work.
- The method slides use the paper's own figures and tables when the material has them (redraw a table as a table, keep its numbers).
- Results compare against the baselines the paper uses, with the metric named; never a number the material lacks.
- A limitations slide, then two or three questions for discussion.
"""
checks = ["논문 제목·저자·발표처가 첫 장에 있는가(없으면 빈칸).", "방법을 결과보다 먼저 설명하는가.", "결과 수치가 자료의 표·그림에 있는 값인가.", "한계와 토론 질문이 있는가."]

[[flow]]
part = "논문·연구 소개"
slides = "1"
layouts = ["title"]

[[flow]]
part = "문제와 동기"
slides = "1-2"
layouts = ["problem-solution", "question"]

[[flow]]
part = "방법"
slides = "2-3"
layouts = ["process", "steps", "two-column"]

[[flow]]
part = "실험 설정"
slides = "1"
layouts = ["table", "bullets"]

[[flow]]
part = "결과"
slides = "2-3"
layouts = ["chart", "table", "number-compare"]

[[flow]]
part = "한계"
slides = "1"
layouts = ["bullets"]

[[flow]]
part = "토론 질문"
slides = "1"
layouts = ["faq", "takeaways"]

[process]
search = false

[[questions]]
id = "paper_identity"
label = "논문 정보"
question = "발표할 논문의 제목·저자·발표처(학회·저널)와 연도를 알려 주세요."
why = "첫 장과 인용에 들어갑니다. 자료에 없으면 빈칸으로 둡니다."
placeholder = "[논문 제목·저자·학회]"
detector = { type = "regex", pattern = '''(?:et\s{0,2}al|arXiv|Proceedings|Conference|Journal|학회|저널|20\d\d)''' }
