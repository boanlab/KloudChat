question = "회의 날짜처럼 빠진 정보가 있으면 먼저 물어봅니다"
compute = "「다음 주 금요일」 같은 날짜를 회의일 기준으로 계산해 둡니다"
write = "회의록을 씁니다"
check = "할 일마다 담당자·기한과 근거를 확인합니다"
