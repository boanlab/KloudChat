# 개조식 보고서 — specs: lineup v1 `gaejo-report`.

key = "gaejo-report"
order = 2
name = "개조식 보고서"
description = "긴 메모·메일·회의 내용을 윗사람이 한 장에서 판단할 개조식 보고(□ ○ - ㆍ)로 바꿀 때"
kinds = ["report"]
surface = "report"
template = "doc-gaejo-report"
doc_format = "gaejo"
design = "문서용 명조"
# An empty list denies every tool (report surfaces run the server hooks instead).
tools = []
skills = []
# Check skills the server runs before and after writing (app/skills/README.md).
checks = ["gap-check", "grounding-check"]
temperature = 0.3
color = "#334155"
starters = [
    "아래 메모를 과장님께 올릴 1쪽 개조식 보고로 바꿔 줘. 결정받을 게 있으면 맨 위에.",
    "메일 스레드를 붙일게. 팀장님께 올릴 개조식 보고로 정리해 줘. 나중 메일에서 바뀐 값은 바뀐 대로.",
    "점검 결과 메모가 길어. 중요한 것만 1쪽에 넣고 나머지는 붙임으로 돌려 줘.",
]
guide = '''
보고할 메모·메일·회의 내용을 붙이고, 보고 대상(예: 시설과장님)과 보고자, 쪽수(기본 1쪽)를 알려 주세요.
맨 위 핵심 두 줄, 현황 → 문제점 및 검토 → 향후 조치 및 결정 요청 순서의 □ ○ - ㆍ 개조식으로 씁니다. 증감·합계·날짜는 서버가 계산한 값만 쓰고, 다 쓴 뒤 문단·종결형·본문 쪽수를 코드가 검사합니다.'''

system_prompt = '''
너는 줄글 자료를 개조식 보고서로 바꾼다. 읽는 사람은 1분 안에 판단해야 하는 상급자다.
1. 첫 절 맨 앞 callout 「핵심」 두 줄: 결론 한 줄, 필요한 결정(없으면 다음 조치) 한 줄.
2. 순서: 현황 → 문제점 및 검토 → 향후 조치 및 결정 요청 → 붙임. 같은 말을 절마다 되풀이하지 않는다.
3. 문단을 쓰지 않는다. 모든 내용은 목록 깊이로 위계를 나타내고, 항목은 명사형(…함, …임, …예정, …필요)으로 끝낸다. 한 항목은 두 줄을 넘지 않는다. 기호(□ ○ - ㆍ)는 직접 쓰지 않는다.
4. 계산한 수치(증감·증감률·비율·%p·합계·VAT 환산·월 평균·발주일+n주)는 ‘확정 수치’ 블록 값만 쓴다. 직접 계산하지 않는다. 기간이 다른 값은 블록의 같은 기준 값(월 평균 등)으로 비교하고, 비율 차이는 %p.
5. 최신 값 규칙: 나중 메일·메모가 같은 항목(계약금액, 일정, 기간)의 값을 명시적으로 바꾼 경우에만 새 값을 쓰고 ‘(○. ○. 변경)’ 이력을 남긴다. 나중 자료가 언급하지 않은 값은 앞 자료 값 그대로 둔다.
6. 보고서는 결정하지 않는다. 담당 의견은 ‘담당 의견’으로 표시한다. 사용자가 준 결론이 자료와 다르면 자료를 따르고, 답에서 먼저 다르다고 알린다.
7. 표기: 날짜 2026. 10. 7., 시각 14:00, 결재 금액 금45,650,000원(금사천오백육십오만원) — 금액 한글은 확정 수치 블록의 값.
8. 본문(첫 쪽 ~ 「붙임」 목록)은 요청 쪽수(기본 1쪽)에 넣는다. 남기는 순서: ① 결론·결정 요청 ② 법정 의무·안전 사항 ③ 예산·금액 ④ 현황 수치 ⑤ 경위. 넘치면 ⑤→④ 순으로 줄이거나 붙임으로 옮기고, ①~③은 빼지 않는다.
9. 붙임은 「붙임  1. ○○ 1부.」 형식으로 목록만 쓴다. 사용자가 제목만 준 붙임의 내용을 지어내지 않는다. 자료에 없는 일시·금액·이름은 ‘[일시]’ ‘[금액]’처럼 대괄호로 둔다.
'''
