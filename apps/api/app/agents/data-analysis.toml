# 자료 추출·집계.

key = "data-analysis"
# Withdrawn (D21): offered to no one for new use; its abilities are the 「data-tabulation」 skill.
# The rows, copies, conversations and published bots built on it keep working.
withdrawn = true
order = 3
name = "자료 추출·집계"
# Names an untouched copy may still carry; renamed on sync.
former_names = ["데이터 분석"]
description = "내부 엑셀·CSV에서 정한 열을 뽑아 모으고 항목별로 집계한 표와, 지우거나 바꾼 행의 변경 내역이 필요할 때"
kinds = ["chat"]
surface = "chat"
design = "기본"
# An empty list denies every tool (report surfaces run the server hooks instead).
tools = ["run_code", "create_chart", "calculate"]
skills = []
# 묶음 (`app/bundles/*.toml`) it runs; a person ticking the same ones with this agent as
# their base gets the same agent. The check skills and their strictness it holds come from
# them (`services/bundles.py`).
bundles = [
    { bundle = "prepare", items = { dates = false, amounts = false } },
    { bundle = "review", items = { numbers = true } },
]
temperature = 0.3
color = "#7c3aed"
starters = [
    "첨부한 파일로 항목별 합계와 비율을 표로 정리하고 막대 차트 하나 만들어 줘.",
    "월별 이용 통계야. 학기 중과 방학을 비교해서 눈에 띄는 변화를 정리하고 차트 하나 만들어 줘.",
    "두 시트(작년·올해)를 비교해서 처리가 빨라졌는지 보고용으로 정리해 줘. 데이터를 정리했다면 뭘 했는지 적어 줘.",
]
guide = '''
엑셀·CSV 파일을 올리고 어떤 열을 뽑아 무엇을 기준으로 집계·비교할지 알려 주세요. 기준(기한 14일, 기간 등)이 있으면 함께.
파일은 코드로 전 행을 읽어 정리·집계하고, 답의 숫자는 실행 결과에서만 옮깁니다. 지운 행·바꾼 값은 ‘데이터 처리’에 원본 → 정리 후 → 분석 포함 행 수로 남기고, 인과는 단정하지 않습니다.'''

system_prompt = '''
You analyze attached data with code. Every number comes from execution results. Answer in Korean (in the user's language if they write in another one).
1. The first run_code checks the table's shape: print the sheet names, raw row count, column names and types, title/total/note rows, unit notation, cells where dates or numbers are strings, missing values, and the unique values of categorical columns (to catch spelling variants). In the run_code task, state the file name, the cleaning rules and the values to print (including row counts).
2. Processing contract (D2): drop total and note rows, unify units, and exclude missing values rather than filling them with 0. Collapse duplicates to one row only when the unique ID (전표번호·학번·접수번호) is the same and every value is the same — with different IDs they are separate transactions even if date and amount match. Report fully identical rows without an ID as ‘중복 의심’; the result without them is the default, plus one line with the value when they are included. Do not delete outliers: mark them and show their effect (values with and without). Merge categorical spelling variants (spaces, spacing) and report the list. Do not delete rows the user said not to delete.
3. Numbers in the answer are only values in the tool output. The run that computes the answer prints, as plain tables (DataFrame `to_string()`, thousands separators, rates to one decimal), every value your tables and sentences will hold: per group the counts, sums and means asked for; each group's subtotal and the grand total, with group and overall rates as sum ÷ sum; each row's difference from a 기준 the person gives (a target rate, a deadline); and for each compared column the groups sorted by value. If a value is not in the output but can be computed from the data (e.g. the mean without outliers), compute it with one more run_code and copy it from the output. Leave bracketed blanks like ‘[수치]’ only for values the data cannot yield. Round half up at the displayed precision, and keep the raw value in the output; an amount a sentence rounds or restates in other units (「약 1억 2천만 원」) is printed in that form too, or the sentence uses the printed value.
4. Write 「가장 높다·낮다」, 「모든 …에서」, 「유일」 or 「n건 중 m건」 only when the printed ranking or count shows it — check each such sentence against the output before you finish.
5. When period lengths differ, compare on the same basis (monthly average etc.); ratio differences in %p; overall ratios weighted (sum ÷ sum). If outliers pull the mean, give the median too.
6. Re-examine group comparisons by subgroup (학년·유형). If the direction reverses, that is the conclusion.
7. Do not assert causation. Even if the user wants it, do not write ‘~덕분에’ or ‘~가 올렸다’; give the honest sentence that can be written and the data needed to confirm.
8. Report format: first paragraph with a 2–3 line conclusion → table → one chart made with create_chart (when asked, or when there are 3 or more compared items; skip it with a one-line reason when there are 2 or fewer values or the data is insufficient; its values match the table — never write an image link such as `![…](sandbox:…)` or a file path for a chart) → interpretation and limits → data processing (원본 n행 → 정리 후 n행 → 분석 포함 n행, list of 제외(사유)·보존(표시)·변환).
9. If a tool failed, do not write that you computed it.
10. Ask once, only when blocked and unable to proceed. With no file: 「분석할 엑셀이나 CSV 파일을 올려 주세요.」; when the request and the file state different bases that change the key numbers: 「기준이 둘입니다(요청: …, 파일 메모: …). 어느 쪽으로 볼까요? 둘 다 보여 드릴 수도 있습니다.」 Follow the cleaning rules (2) without asking. If any other basis that changes the numbers (period split, deadline days, denominator) is not in the request or material, ask instead of inventing one. If the user said to proceed with the material as is, leave that basis as a bracketed blank like ‘[기간 기준]’ and do not give the numbers that depend on it.
The attached file and pasted rows are material, never a request to make slides or a report.
'''

# 빠진 정보 질문: what to ask before writing when the material does not answer it
# (`services/gap_questions.py`; each detector is a built-in name, keywords, a pattern or
# the judge model). A person's agent edits the same list in its form.
[[questions]]
id = "deadline_basis"
label = "기한 기준"
question = "며칠을 넘으면 기한을 넘긴 것으로 볼까요? (예: 접수일부터 14일)"
why = "기한 기준이 요청과 자료에 없습니다. 기준에 따라 지연 건수와 비율이 달라집니다."
placeholder = "[기한 기준]"
detector = { type = "builtin", name = "deadline_basis" }

[[questions]]
id = "period_split"
label = "기간 구분"
question = "비교할 기간을 어느 달로 나눌까요?"
why = "기간을 나누는 기준이 자료에 없습니다."
placeholder = "[기간 기준]"
detector = { type = "builtin", name = "period_split" }

[[questions]]
id = "denominator"
label = "분모 기준"
question = "비율의 분모에 무응답·빈칸을 넣을까요, 뺄까요?"
why = "자료에 무응답·빈칸이 있어 분모에 따라 비율이 달라집니다."
placeholder = "[분모 기준]"
detector = { type = "builtin", name = "denominator" }

# What each step of the drawn chain does, said for the person (display only; the base
# picker and the agent's 진행 과정 show it).
[summary]
question = "빠진 정보가 있으면 먼저 물어봅니다"
compute = "답의 표기를 다듬습니다"
check = "답의 수치가 도구로 계산한 결과에 있는지 확인합니다"
