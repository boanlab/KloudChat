<!doctype html>
<!--
  KloudChat media card: 배경 음악.

  An audio template shapes a prompt and produces no HTML artifact, and sound
  has no picture, so this card has nothing to show and nothing to frame. There
  is therefore no aspect-ratio rectangle anywhere on it — that absence is what
  separates the two sound cards from the four that make pictures.

  What it draws instead is the relationship the template exists to protect. A
  low, even accent band along the floor is the music; the dashed line above it
  is where the speaking voice passes. The bed stays under the line. 슬라이드
  내레이션 draws the same band upside down — tall bars broken by pauses, with
  the dashed line beneath them — and inverting those two heights is the whole
  of what tells the two cards apart. Neither may borrow the other's shape.

  No waveform illustration, no speaker glyph, no emoji: two heights and a
  dashed line say the thing exactly, and anything more would be decoration
  standing in for an argument.

  Drawn in CSS only. The card renders inside a `sandbox=""` frame where nothing
  executes, is served under `default-src 'none'`, and is downloaded and opened
  offline — so there is no script here and no request to anywhere.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
{{TOKENS}}
    /* Every neutral is derived from the ink and every pale plane from the
       accent, so one design system's colours carry the whole card and no grey
       literal can drift out of step with them. */
    --border: color-mix(in srgb, var(--ink) 13%, transparent);
    --hairline: color-mix(in srgb, var(--ink) 10%, transparent);
    --tint: color-mix(in srgb, var(--accent) 8%, transparent);
    --rule: color-mix(in srgb, var(--accent) 38%, transparent);
    /* One scale for all six media cards, so a narrow panel and a printed page
       shrink together instead of one heading at a time. */
    --t-title: clamp(1.05rem, 0.9rem + 0.7vw, 1.45rem);
    --t-body: 0.92rem;
    --t-label: 0.75rem;
    --t-micro: 0.68rem;
    --gap: 0.7rem;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #fff; color: var(--ink); font-family: var(--font-body);
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    padding: clamp(1.2rem, 1rem + 1.4vw, 2rem);
  }
  /* Korean breaks between syllables unless it is told not to, which puts the
     second half of a word on the next line. `keep-all` moves the break to a
     space; `break-word` is the escape hatch for a token with no space in it,
     such as a path or an identifier. */
  body { word-break: keep-all; overflow-wrap: break-word; }

  h1 { margin: 0 0 0.3rem; font-size: var(--t-title); font-weight: 650;
       letter-spacing: -0.015em; line-height: 1.25; text-wrap: balance; }
  /* The lead is body size and reads as a lead by colour alone: a half-step
     down from the body would be a size nobody can tell from it. */
  .lead { margin: 0 0 1.3rem; font-size: var(--t-body); line-height: 1.6;
          color: var(--muted); max-width: 54ch; text-wrap: pretty; }
  /* The caption law: subordinate voices are muted, a shade smaller, never
     italic, and sit 0.5rem under the thing they explain. */
  .note, figcaption, small, dd { display: block; margin: 0.5rem 0 0;
         font-size: 0.85em; line-height: 1.55; color: var(--muted);
         max-width: 54ch; font-style: normal; }

  /* ── two heights and a line ────────────────────────────────────────── */
  .band { margin: 0 0 1.2rem; }
  /* A strip rather than a full-bleed band: what it measures is a few seconds
     of sound, and a rectangle the width of the page would claim otherwise. */
  .meter { display: grid; grid-template-columns: minmax(0, 1fr) 9.5rem;
           gap: 1rem; align-items: stretch; max-width: 40rem; }
  .level { position: relative; height: 3.25rem;
           border-bottom: 1px solid var(--hairline); }
  /* The bed: low, unbroken, and pale, because a background track that draws
     attention has already failed at the one thing it is for. */
  .level .bed { position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
                background: color-mix(in srgb, var(--accent) 30%, transparent); }
  /* Where the speaking voice passes. Nothing is drawn on it — the empty space
     above the line is the point. */
  .level .voice { position: absolute; left: 0; right: 0; bottom: 62%;
                  border-top: 1px dashed color-mix(in srgb, var(--ink) 40%, transparent); }
  /* The two names, at the two heights they name. Their vertical order is the
     card's argument, so it is read off the band rather than off a legend. */
  .keys { position: relative;
          font-size: var(--t-micro); line-height: 1.4; color: var(--muted); }
  .keys span { position: absolute; left: 0; right: 0; text-align: left;
               transform: translateY(-50%); }
  /* 38% down is the dashed line; 81% down is the middle of the bed. Each name
     is pinned to the height it names, so the order is read off the drawing. */
  .keys span:first-child { top: 38%; }
  .keys span:last-child { top: 81%; }

  /* ── the recipe, three blocks across ───────────────────────────────── */
  .blocks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1.4rem; align-items: start; }
  /* Blocks are told apart by a hairline above them, not by three boxes; one
     block per card is filled, and it is always the one that says what the
     track may not do. */
  section { border-top: 1px solid var(--hairline); padding-top: 0.55rem; }
  section.keep { background: var(--tint); border-top: 1px solid var(--rule);
                 padding: 0.55rem 0.8rem 0.7rem; }
  h2 { margin: 0 0 0.4rem; font-size: var(--t-label); font-weight: 700;
       letter-spacing: 0.06em; color: var(--accent); }
  h3 { margin: 0 0 0.3rem; font-size: var(--t-body); font-weight: 650; }
  p { margin: 0 0 0.4rem; font-size: var(--t-body); text-wrap: pretty; }
  p:last-child { margin-bottom: 0; }
  ul, ol { margin: 0; padding-left: 1.05rem; }
  li { margin: 0 0 0.25rem; font-size: var(--t-body); }
  li:last-child { margin-bottom: 0; }
  li::marker { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--hairline); margin: 0.8rem 0; }
  /* Monospace runs large at the same size, so this is an optical match to the
     body rather than a fourth step. */
  code { font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem;
         background: #fff; border: 1px solid var(--border); border-radius: 3px;
         padding: 0.05rem 0.3rem; }

  /* A narrow panel gets the same card standing up, not a shrunken one. The
     band keeps its two columns to the last, because the names have to stay
     beside the heights they name. */
  @media (max-width: 720px) {
    .blocks { grid-template-columns: 1fr; gap: var(--gap); }
  }
  @media (max-width: 460px) { .meter { grid-template-columns: minmax(0, 1fr) 7rem; } }

  /* The recipe is one page and has to stay one page: a rule split across a
     sheet break is a rule somebody reads half of. */
  @page { size: A4 portrait; margin: 16mm; }
  @media print {
    body { padding: 0; }
    h1 { break-after: avoid; }
    section, .band { break-inside: avoid; }
    code { border-color: #999; }
  }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
