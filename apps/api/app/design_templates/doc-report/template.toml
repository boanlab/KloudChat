kind = "document"
name = "보고 문서"
description = "표지를 따로 두고 절 단위로 읽히는 A4 세로 문서"
category = "업무"
fills = ["목적", "독자", "분량"]
example_prompt = "제출용 보고 문서를 써 줘. 확인되지 않은 수치는 쓰지 말고, 마지막에 다음 행동을 적어 줘.\n\n목적과 독자: "
layouts = ["cover", "section"]

# English half of the catalogue. The UI picks a side by language;
# the instructions the model follows stay Korean, because the surfaces
# they belong to answer in Korean by default.
name_en = "Report"
description_en = "A cover of its own, then section by section, A4 portrait"
category_en = "Work"
fills_en = ["Purpose", "Audience", "Length"]
example_prompt_en = "Write a report to submit. Leave out any figure you cannot source, and end with the next actions.\n\nPurpose and audience: "

[wrap]
cover = '<div class="cover"><h1>{title}</h1>{body}</div>'
block = '<section><h2>{title}</h2>{body}</section>'
