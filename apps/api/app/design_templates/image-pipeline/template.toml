kind = "image"
name = "처리 흐름도"
description = "자료가 단계를 거쳐 결과가 되기까지. 단계마다 이름이 붙어 나옵니다"
category = "연구"
fills = ["흐름 설명", "강조할 것", "이름표 언어"]
example_prompt = "{description}\n\n강조할 것: {highlight}\n이름표 언어: {language}"
layouts = ["cover"]

# 도식 경로로 간다 — `image-method/template.toml` 의 설명과 같은 이유다. 흐름도는
# 단계 이름이 전부인 그림이고, 그림 모델은 그 이름을 쓰지 못한다.
figure = "flow"
prompt_suffix = ""

name_en = "Process flow"
description_en = "Data through its stages to a result, each stage named"
category_en = "Research"
fills_en = ["Flow description", "What to highlight", "Label language"]
example_prompt_en = "{description}\n\nWhat to highlight: {highlight}\nLabel language: {language}"

[defaults]
aspect = "16:9"
style = "미니멀"

[[arguments]]
name = "description"
label = "흐름 설명"
label_en = "Flow description"
long = true
default = "센서에서 수집한 원자료를 먼저 결측과 이상값을 걸러 정제한다. 정제한 자료를 10분 단위로 집계해 특징을 뽑고, 특징 저장소에 쌓는다. 예측 모델이 저장소에서 최근 24시간 특징을 읽어 다음 시간의 부하를 예측하고, 예측이 임계값을 넘으면 알림을 보낸다."
default_en = "Raw data from sensors is first cleaned of gaps and outliers. The cleaned data is aggregated in ten-minute windows into features, which accumulate in a feature store. A forecasting model reads the last 24 hours of features from the store to predict the next hour's load, and an alert is sent when the prediction crosses a threshold."

[[arguments]]
name = "highlight"
label = "강조할 것"
label_en = "What to highlight"
default = "최종 출력"
default_en = "the final output"
options = ["최종 출력", "판단이 갈리는 곳", "새로 더한 단계", "없음"]
options_en = ["the final output", "the decision point", "the newly added stage", "none"]

[[arguments]]
name = "language"
label = "이름표 언어"
label_en = "Label language"
default = "한국어"
default_en = "Korean"
options = ["한국어", "영어"]
options_en = ["Korean", "English"]
