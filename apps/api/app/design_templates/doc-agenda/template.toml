kind = "document"
# The document format it fixes (`doc_formats`): head fields, numbering, the format's
# pipeline, and its genre rule in `genre.md`.
doc_format = "agenda"
cover_page = false

# 규칙은 서식 지침에 둔다. 검사는 서버 훅이 맡는다.
skills = []
# Run by the server before and after writing (app/skills/README.md).
check_skills = ["gap-check", "grounding-check"]
name = "회의 안건"
description = "회의 전에 돌리는 안건지 · 안건마다 담당·시간·목표, 사전 자료와 결정할 것"
category = "업무"
fills = ["회의 이름", "일시·장소·참석자", "다룰 안건과 담당"]
example_prompt = "다음 회의의 안건지를 만들어 줘. 안건마다 담당과 시간, 보고·논의·결정 중 무엇인지 적고, 미리 볼 자료와 회의에서 정해야 할 것을 따로 정리해 줘.\n\n회의와 참석자: \n다룰 안건: "
seed_from = "_document"
layouts = ["cover", "section"]

# English half of the catalogue. The UI picks a side by language;
# the instructions the model follows stay Korean, because the surfaces
# they belong to answer in Korean by default.
name_en = "Meeting agenda"
description_en = "Sent before the meeting · owner, time box and goal per item, pre-reads and decisions needed"
category_en = "Work"
fills_en = ["Meeting", "When, where, who", "Items and owners"]
example_prompt_en = "Draft the agenda for the next meeting. Give each item an owner, a time box and whether it is for information, discussion or decision, and list the pre-reads and what the meeting has to decide.\n\nMeeting and attendees: \nItems: "

[wrap]
cover = '<div class="cover"><h1>{title}</h1>{body}</div>'
block = '<section><h2>{title}</h2>{body}</section>'

# 빠진 정보 질문: what to ask before writing when the material does not answer it
# (`services/gap_questions.py`; each detector is a built-in name, keywords, a pattern or
# the judge model). A person's agent edits the same list in its form.
[[questions]]
id = "meeting_date"
label = "회의 일시"
question = "회의는 언제 하나요? (연도 포함)"
why = "자료에 회의 날짜가 없습니다. 머리의 일시와 사전 자료 공유 기한을 날짜로 적으려면 필요합니다."
placeholder = "[회의 일자]"
detector = { type = "builtin", name = "meeting_date" }

[[questions]]
id = "attendees"
label = "참석자"
question = "누가 참석하나요?"
why = "자료에 참석자가 없습니다. 안건지의 참석자 칸과 안건 담당에 쓰입니다."
placeholder = "[참석자]"
detector = { type = "builtin", name = "attendees" }

# 진행 과정 설정 (`services/process_settings.py`): what writing in this 서식 does besides
# writing. A person's agent or template sets the same keys in its form.
[process]
prepass = ["date-calc"]
checks = ["lead-dates", "material-blanks"]
head = ["meeting-date"]
# An agenda is read from its table: no picture unless asked.
draws = "when-asked"
# Written from the organiser's own material: no web search.
search = false
