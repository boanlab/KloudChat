<!doctype html>
<!--
  KloudChat document seed — lab note.

  The shape is the order of the work: 목적 → 방법 → 결과 → 한계, written so a
  reader can run it again. Sections are numbered by a CSS counter rather than
  by the wrapper, because the cover is block one and a method step labelled
  "02" would be counting the wrong thing.

  Three decisions carry the look, and each is answering the same reader — a
  demonstrator with the report in one hand and last year's in the other.

  1. A 9rem margin column holds nothing but the section heading and its
     number. 목적·방법·결과·한계 therefore stack down the left edge as a
     contents list the eye can run, and the body column keeps one width from
     the first page to the last, so two notes laid side by side compare
     section against section.

  2. Readings are set in a fixed-width face, right-aligned, with tabular
     figures, and the column name stands on that same right edge. Numbers only
     compare when they share a face, a digit width and an edge — that
     comparison is the reason this template exists, so it gets the one bold
     move and everything else stays quiet.

  3. The table itself is ruled the way a printed table is ruled: a name row in
     muted small caps over a 2px accent rule, no line between rows, one
     hairline closing the block. Row rules are what makes a generated table
     look generated, and they are the lines a reader is not using.

  Print collapses the margin column to one column: a grid that fragments
  across pages is not something to trust when the print dialogue *is* the PDF
  exporter.

  Nothing here executes: artifacts render in a `sandbox=""` iframe, so the
  whole shell is CSS. See `services/design_templates.py`.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
{{TOKENS}}
    --paper: #ffffff;
    /* Every neutral is mixed from --ink and every pale field from --accent, so
       the note answers the same way to any design system the project carries.
       No literal grey appears below this block. */
    --hairline: color-mix(in srgb, var(--ink) 10%, transparent);
    --border: color-mix(in srgb, var(--ink) 13%, transparent);
    --rule: color-mix(in srgb, var(--accent) 35%, transparent);
    --tint: color-mix(in srgb, var(--accent) 6%, transparent);
    /* Readings only line up in a fixed-width face. `--font-mono` is not one of
       the four values the design system sends, so it is read with a fallback
       rather than assumed. */
    --mono: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: color-mix(in srgb, var(--ink) 5%, #fff);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  /* Korean breaks between syllables unless it is told not to, which puts the
     second half of a word on the next line. `keep-all` moves the break to a
     space; `break-word` is the escape hatch for a token with no space in it,
     such as a path, a unit or a component code. */
  body { word-break: keep-all; overflow-wrap: break-word; }
  .page {
    max-width: 52rem;
    margin: 0 auto;
    padding: 2.8rem 3rem 5rem;
    background: var(--paper);
    min-height: 100vh;
    counter-reset: entry;
  }

  /* ── cover: the run header ─────────────────────────────────────────
     Title, the one thing this note set out to find out, and the facts a
     reader needs before the method makes sense.

     The accent rule above the title is 9rem wide rather than full bleed: it
     stands exactly over the margin column the rest of the document uses, so
     the cover states the measure the note is set to before any section has to
     demonstrate it. A rule from edge to edge would have said nothing and
     read, at the very top of a frame, as chrome. */
  .cover { padding: 0 0 1.2rem; }
  .cover::before {
    content: "";
    display: block;
    width: 9rem;
    height: 6px;
    margin-bottom: 1.9rem;
    background: var(--accent);
  }
  .cover h1 {
    margin: 0 0 0.7rem;
    font-size: clamp(1.75rem, 4.2vw, 2.45rem);
    font-weight: 650;
    line-height: 1.22;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  /* `.lead` is what the exporters read, but a cover paragraph is the lead
     whether or not the model remembered to say so. It stays at reading size:
     it is the question the note asks, not a caption on the title. */
  .cover p, .cover .lead {
    margin: 0 0 1.6rem;
    max-width: 44ch;
    color: var(--muted);
    font-size: 1.02rem;
    line-height: 1.6;
  }
  .cover table { width: auto; margin: 0; border-top: 1px solid var(--border); font-size: 0.88rem; }
  .cover td { padding: 0.45em 1.8em 0.45em 0; border-bottom: 1px solid var(--hairline); }
  .cover td:first-child { color: var(--muted); font-size: 0.84rem; white-space: nowrap; }
  /* A label list, not a reading: values stay left, where the eye starts, but
     keep the fixed-width face so a date, a part number and a path line up. */
  .cover td + td { font-family: var(--mono); font-size: 0.86rem; text-align: left; }

  /* ── a section ─────────────────────────────────────────────────────
     Heading in the margin column, everything else in the body column. There
     is deliberately no third column: a lab note annotates its numbers
     directly under them, and a sidenote rail is the report's device, not
     this one's. */
  .page > section {
    counter-increment: entry;
    display: grid;
    grid-template-columns: minmax(0, 9rem) minmax(0, 1fr);
    gap: 0 1.9rem;
    border-top: 1px solid var(--border);
    margin-top: 2.4rem;
    padding-top: 1.9rem;
  }
  .page > section > * { grid-column: 2; }
  .page > section > :last-child { margin-bottom: 0; }
  .page > section > h2 {
    grid-column: 1;
    align-self: start;
    margin: 0;
    font-size: 1.02rem;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .page > section > h2::before {
    content: counter(entry, decimal-leading-zero);
    display: block;
    margin-bottom: 0.35rem;
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--accent);
  }

  /* A method's sub-step is a heading, not an aside. */
  h3 {
    margin: 1.5rem 0 0.45rem;
    font-size: 0.98rem;
    font-weight: 650;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }
  p { margin: 0 0 0.85rem; text-wrap: pretty; }
  ul, ol { margin: 0 0 0.9rem; padding-left: 1.3rem; }
  /* A fixed-width step number is wider than a bullet, and a marker wider than
     its list's padding hangs outside the border box — which the printed page
     then clips at the margin. The indent is set to the marker, not inherited
     from the unordered list. */
  ol { padding-left: 2rem; }
  li { margin: 0 0 0.4rem; }
  li::marker { color: var(--accent); }
  /* An ordered list here is a procedure somebody follows step by step, so its
     numbers take the same face as the readings they produce. */
  ol > li::marker { font-family: var(--mono); font-size: 0.9em; }
  strong { font-weight: 650; }
  blockquote {
    margin: 1.2rem 0; padding: 0.1rem 0 0.1rem 1rem;
    border-left: 3px solid var(--rule); color: var(--muted);
  }

  /* ── a line of working ─────────────────────────────────────────────
     A demonstrator reads the derivation as closely as the result, and a
     formula written as prose is a formula nobody checks. `.formula` is one
     step of the working: fixed width, so an exponent and a subscript keep
     their place, and a hairline down the left so consecutive steps read as
     one column rather than three stray paragraphs. */
  p.formula {
    margin: 1rem 0;
    padding: 0.1rem 0 0.1rem 1rem;
    border-left: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 0.95rem;
    line-height: 1.85;
    font-variant-numeric: tabular-nums;
    overflow-x: auto;
  }
  p.formula + p.formula { margin-top: -1rem; }

  /* ── readings ──────────────────────────────────────────────────────
     Ruled the way a table in a paper is ruled: names, an accent rule, the
     block of numbers, one hairline closing it. Nothing between rows — those
     lines are not the ones anybody reads down. */
  table { width: 100%; border-collapse: collapse; margin: 1.2rem 0 0.5rem; font-size: 0.92rem; }
  th, td { padding: 0.48em 0.7em; text-align: left; vertical-align: top; }
  th:first-child, td:first-child { padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  th {
    font-size: 0.8rem; font-weight: 600; color: var(--muted);
    letter-spacing: 0.01em; line-height: 1.35;
    border-bottom: 2px solid var(--accent);
  }
  tbody tr:last-child td { border-bottom: 1px solid var(--border); }
  /* A reading table is item-then-values: the first cell names the row and the
     rest are numbers. Numbers compare only when they share a face, a digit
     width and an edge, and the column name has to stand on that same edge. */
  thead th + th, tbody td + td { text-align: right; font-variant-numeric: tabular-nums; }
  tbody td + td { font-family: var(--mono); font-size: 0.95em; letter-spacing: -0.01em; }

  /* ── captions and subordinate voices ───────────────────────────────
     One behaviour everywhere: 0.83rem, 1.6, muted, 54ch, upright, half a rem
     under whatever it explains. A caption cannot carry a class of its own —
     the model writes the inside of a block, and the seed styles only what it
     can already see — so a caption is the `small` that follows the thing it
     describes, or the `figcaption` inside it. */
  small { color: var(--muted); font-size: 0.83rem; font-style: normal; }
  section > small, table + small, figure + small, figcaption {
    display: block;
    margin: 0 0 1.4rem;
    max-width: 54ch;
    font-size: 0.83rem;
    line-height: 1.6;
    color: var(--muted);
  }
  /* The one place an accent may appear inside small type: the value the
     caption is pointing at — a table number, a count, a tolerance. */
  section > small strong, table + small strong, figure + small strong, figcaption strong {
    font-family: var(--mono); font-weight: 600; color: var(--accent);
  }
  /* A figure here is usually a described one — the setup, the trace, or the
     shape of the curve in words — kept in a plate the eye can skip to. It can
     also be a picture, embedded in the file rather than fetched, so the plate
     has to hold both. Pale field, hairline edge, no bar down the side: the
     accent is already spent on this page. */
  figure {
    margin: 1.3rem 0 0.5rem; padding: 1rem 1.2rem;
    background: var(--tint);
    border: 1px solid var(--hairline);
    break-inside: avoid;
  }
  figure img { display: block; max-width: 100%; max-height: 60vh; width: auto; height: auto; }
  figure > :last-child { margin-bottom: 0; }
  figcaption { margin: 0.5rem 0 0; max-width: none; }

  /* The rest of the vocabulary `sanitise` lets through. A block that reaches
     for a definition list or a rule should get typography rather than the
     browser's defaults — an unstyled `<dl>` is how model output starts to
     look like model output. A `<dl>` in a lab note is nearly always symbols
     and units, so the term takes the same fixed-width face as the readings it
     names, and the definition follows the caption law. */
  dl { margin: 1.1rem 0 1.2rem; }
  dt { font-family: var(--mono); font-size: 0.9rem; font-weight: 600; }
  dt + dd { margin-top: 0.5rem; }
  dd {
    margin: 0.5rem 0 0.9rem;
    max-width: 54ch;
    font-size: 0.85rem;
    line-height: 1.55;
    color: var(--muted);
  }
  hr { border: 0; border-top: 1px solid var(--hairline); margin: 1.6rem 0; }

  /* ── narrow panel ──────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    .page { padding: 1.8rem 1.4rem 3rem; }
    .cover::before { margin-bottom: 1.4rem; }
    .page > section { grid-template-columns: minmax(0, 1fr); margin-top: 1.9rem; padding-top: 1.5rem; }
    .page > section > *, .page > section > h2 { grid-column: 1; }
    .page > section > h2 { margin-bottom: 0.8rem; }
    .page > section > h2::before { display: inline; margin-right: 0.5rem; }
    /* A four-column reading table is wider than the preview panel. Scrolling
       it keeps the columns aligned; reflowing them would not. */
    table { display: block; overflow-x: auto; }
  }

  /* ── print: A4 portrait, cover on its own page ─────────────────────── */
  @page { size: A4 portrait; margin: 20mm 18mm; }
  @media print {
    body { background: #fff; }
    .page { max-width: none; margin: 0; padding: 0; min-height: 0; }
    .cover { padding-bottom: 30vh; page-break-after: always; break-after: page; }
    .page > section { display: block; margin-top: 1.6rem; padding-top: 1.4rem; }
    .page > section > h2 { margin-bottom: 0.6rem; page-break-after: avoid; break-after: avoid; }
    .page > section > h2::before { display: inline; margin-right: 0.5rem; }
    table { display: table; }
    /* A reading table that runs onto the next page keeps its column names. */
    thead { display: table-header-group; }
    tr, figure, blockquote, p.formula, dl { page-break-inside: avoid; break-inside: avoid; }
    section > small, table + small, figcaption { page-break-before: avoid; break-before: avoid; }
  }
</style>
</head>
<body>
<div class="page">
{{BODY}}
</div>
</body>
</html>
