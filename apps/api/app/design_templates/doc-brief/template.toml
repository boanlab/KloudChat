kind = "document"
name = "한 장 요약"
description = "결정에 필요한 것만 카드로 나눠 한 장에 담는 문서"
category = "업무"
fills = ["결정할 것", "기한"]
example_prompt = "한 장짜리 요약 문서를 만들어 줘. 무엇을 결정해야 하는지, 무엇이 걸려 있는지, 다음에 뭘 할지가 한눈에 보이게.\n\n결정할 것: "
layouts = ["cover", "section"]

# English half of the catalogue. The UI picks a side by language;
# the instructions the model follows stay Korean, because the surfaces
# they belong to answer in Korean by default.
name_en = "One-pager"
description_en = "Only what the decision needs, as cards, on a single page"
category_en = "Work"
fills_en = ["Decision", "Deadline"]
example_prompt_en = "Make a one-page brief: what has to be decided, what is at stake, and what happens next.\n\nDecision: "

[wrap]
cover = '<div class="cover"><h1>{title}</h1>{body}</div>'
block = '<section><h2>{title}</h2>{body}</section>'
group = '<div class="grid">{blocks}</div>'
