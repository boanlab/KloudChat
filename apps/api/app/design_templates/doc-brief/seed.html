<!doctype html>
<!--
  KloudChat document seed — one-pager.

  A ledger, not a set of cards. Every box, tint and rounded corner is gone:
  what separates one item from the next is a hairline above it, and what
  separates the two columns is a hairline running the height of the sheet.
  Removing the frames is what buys the density — this has to be one A4 page
  somebody decides from in two minutes, and a border plus a radius plus a
  padded tint costs about six millimetres per item.

  The last item is the exception, and it is the one bold move: it spans both
  columns and is the only filled block on the sheet, because in this shape the
  last item is always what happens next. That is CSS on `:last-child` rather
  than a class, so the rule cannot be forgotten by whoever writes the content.

  There is no cover page and no page break anywhere — a one-pager that runs to
  two pages has failed at the only thing it promised.

  No script. Artifacts render in a `sandbox=""` iframe and the file is also
  downloaded and opened offline. See `services/design_templates.py`.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
{{TOKENS}}
    --paper: #ffffff;
    /* No grey literal: the ledger's rules are the design system's ink, weak. */
    --hair: color-mix(in srgb, var(--ink) 12%, transparent);
    --wash: color-mix(in srgb, var(--ink) 5%, #fff);
    /* Mixed into the paper rather than into transparency, so the one filled
       block is opaque and the ledger rule does not ghost through it. */
    --tint: color-mix(in srgb, var(--accent) 8%, var(--paper));
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--wash);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* Korean breaks between syllables unless it is told not to, which puts the
     second half of a word on the next line. `keep-all` moves the break to a
     space; `break-word` is the escape hatch for a token with no space in it,
     such as a path or an identifier. */
  body { word-break: keep-all; overflow-wrap: break-word; }
  .page { max-width: 54rem; margin: 0 auto; padding: 3rem 2.6rem 3.4rem; background: var(--paper); }

  /* ── the head of the sheet ─────────────────────────────────────────
     Full width, above the ledger, and no page break under it. */
  .cover { margin: 0 0 1.9rem; }
  .cover h1 {
    margin: 0 0 0.45rem;
    max-width: 24ch;
    font-size: clamp(1.7rem, 3.4vw, 2.3rem);
    font-weight: 650;
    line-height: 1.22;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  /* `.lead` is what the exporters read, but a cover paragraph is the lead
     whether or not the model remembered to say so. */
  .cover .lead, .cover > p {
    margin: 0;
    max-width: 56ch;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
  }
  .cover::after {
    content: "";
    display: block;
    width: 3rem;
    height: 4px;
    margin-top: 1.1rem;
    background: var(--accent);
  }

  /* ── the ledger ────────────────────────────────────────────────────
     Two columns divided by one continuous hairline, and each item opened by a
     hairline of its own. No frames, no fills, no radius.

     Multi-column rather than a two-track grid, for two reasons a decision
     sheet cares about: the browser balances the columns, so five items of
     different lengths do not leave a hand's width of white down one side, and
     `column-rule` draws the divider exactly as far as the columns actually
     run instead of down the whole block. */
  .grid {
    column-count: 2;
    column-gap: 2.4rem;
    column-rule: 1px solid var(--hair);
  }
  .grid > section {
    padding: 0.75rem 0 0;
    margin: 0 0 1.1rem;
    border-top: 1px solid var(--hair);
    break-inside: avoid;
    page-break-inside: avoid;
  }
  /* The one bold move. The last item is always what happens next, so it takes
     the full measure and is the only thing on the sheet that is filled. No new
     class: the rule is where it cannot be forgotten. */
  .grid > section:last-child {
    column-span: all;
    margin: 0;
    padding: 0.85rem 1.1rem 1rem;
    background: var(--tint);
  }

  /* ── type ──────────────────────────────────────────────────────────
     An item's heading is a signpost, not something to read, so it is smaller
     than the body under it — the one place in the catalogue where that
     relationship is inverted, and what lets six items sit on one sheet. */
  h2 {
    margin: 0 0 0.5rem;
    color: var(--accent);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    line-height: 1.4;
  }
  h3 { margin: 0.75rem 0 0.25rem; font-size: 0.98rem; font-weight: 650; }
  p { margin: 0 0 0.5rem; font-size: 0.95rem; text-wrap: pretty; }
  p:last-child { margin-bottom: 0; }
  ul, ol { margin: 0 0 0.2rem; padding-left: 1.05rem; }
  li { margin: 0 0 0.28rem; font-size: 0.95rem; line-height: 1.55; }
  li::marker { color: var(--accent); }
  blockquote {
    margin: 0.5rem 0;
    padding-left: 0.9rem;
    border-left: 1px solid var(--hair);
    color: var(--muted);
    font-size: 0.92rem;
  }
  /* A table here is three rows at most; it is a comparison, not a dataset. */
  table { width: 100%; border-collapse: collapse; margin: 0.2rem 0 0.3rem; font-size: 0.9rem; }
  th {
    padding: 0.3em 0.5em 0.3em 0;
    border-bottom: 1px solid var(--hair);
    color: var(--muted);
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-align: left;
  }
  td {
    padding: 0.34em 0.5em 0.34em 0;
    border-bottom: 1px solid var(--hair);
    text-align: left;
    vertical-align: top;
    font-variant-numeric: tabular-nums;
  }
  th:last-child, td:last-child { padding-right: 0; }

  /* ── the subordinate voice ─────────────────────────────────────────
     Same as everywhere else in the catalogue: 0.85em, line-height 1.55,
     `--muted`, at most 54ch, never italic, half a rem under what it explains. */
  small, figcaption, dd {
    color: var(--muted);
    font-size: 0.85em;
    line-height: 1.55;
    font-style: normal;
    max-width: 54ch;
  }
  section > small { display: block; margin-top: 0.5rem; }
  dl { margin: 0 0 0.5rem; }
  dt { font-weight: 650; font-size: 0.95rem; }
  dd { margin: 0.15rem 0 0.5rem; }
  hr { border: 0; border-top: 1px solid var(--hair); margin: 0.7rem 0; }
  /* A picture is a data URI the server embedded; nothing here fetches from
     outside a sandboxed artifact. */
  figure { margin: 0.6rem 0; break-inside: avoid; }
  /* Half a column wide and one sheet tall: a picture that grows past this is
     what turns a one-pager into a two-pager. */
  figure img { display: block; max-width: 100%; max-height: 32vh; width: auto; height: auto; }
  figcaption { margin-top: 0.5rem; }

  /* `screen and` is load-bearing: a width query is evaluated against the page
     box when printing, and A4 is 794px. A breakpoint left unscoped is one that
     can fold the sheet into a single column on paper. */
  @media screen and (max-width: 720px) {
    .page { padding: 2rem 1.3rem 2.6rem; }
    .grid { column-count: 1; column-rule: 0; }
    .grid > section:last-child { padding: 0.85rem 1rem 1rem; }
  }

  @page { size: A4 portrait; margin: 14mm; }
  @media print {
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #fff; }
    .page { max-width: none; margin: 0; padding: 0; }
    .cover { margin-bottom: 8mm; page-break-after: avoid; break-after: avoid; }
    /* One page is the point of a one-pager: nothing may break onto a second. */
    .grid { column-gap: 12mm; }
    .grid > section { margin-bottom: 6mm; }
  }
</style>
</head>
<body>
<div class="page">
{{BODY}}
</div>
</body>
</html>
