kind = "image"
name = "방법 구조도"
description = "논문의 제안 방법을 구성 요소와 흐름으로 그린 그림. 이름표가 붙어 나옵니다"
category = "연구"
fills = ["방법 설명", "강조할 것", "이름표 언어"]
example_prompt = "{description}"
layouts = ["cover"]

# 그림 모델이 아니라 도식 경로로 간다.
#
# 그림 모델은 글자를 못 쓴다. 그래서 앞판은 「이름표 자리는 비워 둡니다」라고
# 스스로 적어 두었고, 이름표 없는 방법 그림은 논문에 넣을 수 없다 — 장식이지
# 그림이 아니다. `figure` 가 있는 서식은 설명을 언어 모델에 주어 mermaid 로
# 쓰게 하고, 화면이 서식의 글꼴로 그려 저장한다. 이름표는 설명에 쓴 용어
# 그대로다.
#
# 규칙은 PaperBanana 의 NeurIPS 2025 도식 스타일 가이드를 mermaid 가 말할 수
# 있는 것으로 옮긴 것이다(`services/diagram.py`): 단계마다 옅은 파스텔 존,
# 처리는 둥근 모양, 자료는 각진 모양, 저장소는 원통, 본류는 실선, 보조 흐름은
# 점선, 강조는 하나.
figure = "method"
prompt_suffix = ""

name_en = "Method figure"
description_en = "The proposed method as components and flows, with its labels on"
category_en = "Research"
fills_en = ["Method description", "What to highlight", "Label language"]
example_prompt_en = "{description}"

[defaults]
aspect = "16:9"
style = "미니멀"

[[arguments]]
name = "description"
label = "방법 설명"
label_en = "Method description"
long = true
default = "입력 문장을 인코더가 토큰 임베딩으로 바꾼다. 검색 모듈이 외부 문서 저장소에서 관련 문단 세 개를 가져와 임베딩과 이어 붙인다. 디코더가 이어 붙인 표현으로 답을 생성하고, 검증기가 답과 문단을 대조해 점수를 낸다. 점수는 디코더에만 되먹임되어 학습에 쓰인다."
default_en = "An encoder turns the input sentence into token embeddings. A retrieval module fetches three related passages from an external document store and concatenates them with the embeddings. A decoder generates the answer from the joined representation, and a verifier scores the answer against the passages. The score is fed back to the decoder only, for training."

[[arguments]]
name = "highlight"
label = "강조할 것"
label_en = "What to highlight"
default = "학습되는 부분"
default_en = "the trained part"
options = ["학습되는 부분", "최종 출력", "새로 제안한 모듈", "없음"]
options_en = ["the trained part", "the final output", "the newly proposed module", "none"]

[[arguments]]
name = "language"
label = "이름표 언어"
label_en = "Label language"
default = "한국어"
default_en = "Korean"
options = ["한국어", "영어"]
options_en = ["Korean", "English"]
