kind = "image"
name = "방법 구조도"
description = "논문·보고서의 제안 방법을 한 장으로 보여 주는 그림. 이름표 자리는 비워 둡니다"
category = "연구"
fills = ["무엇의 구조인지", "구성 방식", "그리는 결"]
example_prompt = "{subject}의 구조를 논문 그림처럼 한 장으로 보여 줘. {shape} 구성으로, {texture} 느낌으로 그려 줘."
layouts = ["cover"]

# 학술 도판의 관례를 그대로 적는다.
#
# 그림 모델이 글자를 제대로 못 쓴다는 사실은 그대로다. 그래서 이름표는 여전히
# 맡기지 않고 자리만 남긴다 — 논문 그림의 이름표는 본문 용어와 한 글자도
# 어긋나면 안 되고, 그건 사람이 얹어야 정확하다.
#
# 나머지는 최근 학회 도판이 실제로 지키는 것들이다: 채도 낮은 파스텔 바탕으로
# 단계를 묶고, 진한 색은 정말 강조할 하나에만 쓰고, 처리 단계는 모서리를 둥글게,
# 자료는 각지게, 데이터 흐름은 실선, 보조 흐름은 점선으로 가른다.
prompt_suffix = "academic paper method figure, clean modular schematic with clear left-to-right progression, draw the things the subject actually names as recognisable objects — devices, sensors, servers, racks, documents, containers, people — each one a distinct silhouette rather than an empty rectangle, because a figure with no lettering has only its shapes to say anything; group related objects inside a pale tinted zone, and let size and colour weight say which part matters, pale desaturated pastel zones grouping stages, medium-saturation fills reserved for the two or three active modules, one accent colour only for the highlighted path, rounded outlines for processes and squared outlines for data, solid connectors for the forward path and dashed connectors for auxiliary paths, at most seven objects, thin uniform strokes, flat even lighting, no drop shadows, clear separation between objects so none of them touch, no text, no lettering, no numbers, no logos, no faces"

name_en = "Method figure"
description_en = "The proposed method as a single paper-style figure, with label slots left empty"
category_en = "Research"
fills_en = ["What the structure is", "How it is arranged", "Rendering"]
example_prompt_en = "A paper-style figure showing how {subject} is structured, arranged {shape}, drawn in {texture}."

[defaults]
aspect = "16:9"
style = "미니멀"

[[arguments]]
name = "subject"
label = "무엇의 구조"
label_en = "Structure of what"
default = "제안 모델의 학습 파이프라인"
default_en = "the proposed model's training pipeline"

[[arguments]]
name = "shape"
label = "구성 방식"
label_en = "Arrangement"
default = "왼쪽에서 오른쪽으로 흐르는"
default_en = "flowing left to right"
options = ["왼쪽에서 오른쪽으로 흐르는", "층으로 쌓인", "가운데 모듈을 중심으로 갈라지는", "두 갈래를 나란히 견주는", "되먹임 고리가 있는"]
options_en = ["flowing left to right", "stacked in layers", "branching from a central module", "two branches side by side", "with a feedback loop"]

[[arguments]]
name = "texture"
label = "결"
label_en = "Rendering"
default = "옅은 파스텔 면과 가는 선"
default_en = "pale pastel planes and thin lines"
options = ["옅은 파스텔 면과 가는 선", "흑백에 강조색 하나", "점선으로 단계를 나눈 도면", "입체 블록으로 쌓은"]
options_en = ["pale pastel planes and thin lines", "greyscale with a single accent", "a drafting sheet with dashed stages", "stacked isometric blocks"]
