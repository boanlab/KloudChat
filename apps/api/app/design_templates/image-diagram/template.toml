kind = "image"
name = "개념도"
description = "개념들의 관계와 층위를 그린 그림. 개념마다 이름이 붙어 나옵니다"
category = "연구"
fills = ["개념 설명", "강조할 것", "이름표 언어"]
example_prompt = "{description}\n\n강조할 것: {highlight}\n이름표 언어: {language}"
layouts = ["cover"]

# 도식 경로로 간다 — `image-method/template.toml` 의 설명과 같은 이유다.
figure = "concept"
prompt_suffix = ""

name_en = "Concept diagram"
description_en = "Concepts and how they relate, each one named"
category_en = "Research"
fills_en = ["Concept description", "What to highlight", "Label language"]
example_prompt_en = "{description}\n\nWhat to highlight: {highlight}\nLabel language: {language}"

[defaults]
aspect = "16:9"
style = "미니멀"

[[arguments]]
name = "description"
label = "개념 설명"
label_en = "Concept description"
long = true
default = "디지털 리터러시는 정보 리터러시, 미디어 리터러시, 데이터 리터러시 세 갈래로 나뉜다. 정보 리터러시는 검색과 평가를, 미디어 리터러시는 해석과 제작을, 데이터 리터러시는 읽기와 분석을 포함한다. 세 갈래는 모두 비판적 사고를 바탕에 두고, 시민 참여라는 하나의 목표로 모인다."
default_en = "Digital literacy divides into information, media and data literacy. Information literacy covers search and evaluation; media literacy interpretation and production; data literacy reading and analysis. All three rest on critical thinking and converge on one goal, civic participation."

[[arguments]]
name = "highlight"
label = "강조할 것"
label_en = "What to highlight"
default = "가운데 개념"
default_en = "the central concept"
options = ["가운데 개념", "바탕이 되는 것", "목표", "없음"]
options_en = ["the central concept", "the foundation", "the goal", "none"]

[[arguments]]
name = "language"
label = "이름표 언어"
label_en = "Label language"
default = "한국어"
default_en = "Korean"
options = ["한국어", "영어"]
options_en = ["Korean", "English"]
