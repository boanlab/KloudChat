<!doctype html>
<!--
  KloudChat media card: 개념도.

  An image template shapes a prompt and produces no HTML artifact, so there is
  nothing generated for the gallery to show. What it shows instead is the
  recipe: the order the sentence is written in, and the lines this template
  will not cross. A sample picture here would promise a result that depends on
  the picture model and on the project's design system, and this file knows
  neither.

  Two things are different here from the other two picture cards, and both are
  true of the thing being asked for. The frame is 16:9 with no dashed area
  inside it, because a concept diagram carries no title — the labels go on the
  slide afterwards. And what to keep and what to leave out is one decision, so
  those two lists face each other rather than following one another down the
  page. Neither the cover nor the poster card uses that pair.

  The card is read at 1000×500 scaled down to a gallery tile, and again in a
  ~400px panel, so its grids collapse rather than shrink. It carries no
  behaviour and therefore nothing to run: it renders inside a `sandbox=""`
  frame where nothing executes, is served under `default-src 'none'`, and is
  also downloaded and opened outside one.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
{{TOKENS}}
    /* Every neutral is derived from the ink and every pale plane from the
       accent, so one design system's colours carry the whole card and no grey
       literal can drift out of step with them. */
    --border: color-mix(in srgb, var(--ink) 13%, transparent);
    --hairline: color-mix(in srgb, var(--ink) 10%, transparent);
    --wash: color-mix(in srgb, var(--ink) 3%, transparent);
    --tint: color-mix(in srgb, var(--accent) 8%, transparent);
    --rule: color-mix(in srgb, var(--accent) 38%, transparent);
    /* One scale for all six media cards, so a narrow panel and a printed page
       shrink together instead of one heading at a time. */
    --t-title: clamp(1.05rem, 0.9rem + 0.7vw, 1.45rem);
    --t-body: 0.92rem;
    --t-label: 0.75rem;
    --t-micro: 0.68rem;
    --gap: 0.7rem;
    /* Wide, because the drawing standing in it is 16:9. Its height comes from
       the ratio, so the column is the only number that has to be chosen. */
    --frame-w: 15rem;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #fff; color: var(--ink); font-family: var(--font-body);
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    padding: clamp(1.2rem, 1rem + 1.4vw, 2rem);
  }
  /* Korean breaks between syllables unless it is told not to, which puts the
     second half of a word on the next line. `keep-all` moves the break to a
     space; `break-word` is the escape hatch for a token with no space in it,
     such as a path or an identifier. */
  body { word-break: keep-all; overflow-wrap: break-word; }

  /* ── identity beside the frame ─────────────────────────────────────── */
  .head { display: grid; grid-template-columns: minmax(0, 1fr) auto;
          gap: clamp(1rem, 0.4rem + 2.2vw, 2.6rem); align-items: start;
          margin: 0 0 1.15rem; }
  h1 { margin: 0 0 0.3rem; font-size: var(--t-title); font-weight: 650;
       letter-spacing: -0.015em; line-height: 1.25; text-wrap: balance; }
  /* The lead is body size and reads as a lead by colour alone: a half-step
     down from the body would be a size nobody can tell from it. */
  .lead { margin: 0; font-size: var(--t-body); line-height: 1.6;
          color: var(--muted); max-width: 54ch; text-wrap: pretty; }
  /* The accent at the three strengths a structure drawing needs: the
     connector, the plane it joins, the ground behind both. A bar rather than
     three chips, because it is a range and not three separate things. */
  .swatch { display: flex; gap: 0.4rem; margin: 1rem 0 0; max-width: 54ch; }
  .swatch span { flex: 1; height: 1.7rem; border: 1px solid var(--border); }
  .s-line { background: var(--accent); }
  .s-plane { background: color-mix(in srgb, var(--accent) 40%, #fff); }
  .s-ground { background: color-mix(in srgb, var(--ink) 6%, #fff); }
  /* The column is exactly as wide as the drawing, so the caption under it
     measures the frame instead of drifting past its edge. */
  .plan { width: var(--frame-w); }
  /* No dashed inset: a concept diagram carries no title, so there is no area
     to keep clear, and drawing one would be a rule this template never made.
     What is drawn inside instead is the count and the spacing this template
     asks for — six planes, one kind of connector, air between them — which is
     the only thing the picture is actually being told. The cover and poster
     cards mark a title-safe area in theirs; this one marks a census. */
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9;
           border: 1px solid var(--border); background: var(--wash);
           display: grid; grid-template-columns: repeat(3, 1fr);
           grid-template-rows: repeat(2, 1fr);
           gap: 1rem 0.8rem; padding: 0.75rem; }
  .frame i { position: relative; display: block;
             background: color-mix(in srgb, var(--accent) 22%, #fff);
             border: 1px solid color-mix(in srgb, var(--accent) 45%, #fff); }
  /* One connector, drawn once per pair, in the gap the grid already left. */
  .frame i:nth-child(-n+3)::after {
    content: ""; position: absolute; left: 50%; top: 100%;
    width: 1px; height: 1rem; background: var(--rule); }
  /* The caption law: subordinate voices are muted, a shade smaller, never
     italic, and sit 0.5rem under the thing they explain. */
  .note, figcaption, small, dd { display: block; margin: 0.5rem 0 0;
         font-size: 0.85em; line-height: 1.55; color: var(--muted);
         max-width: 54ch; font-style: normal; }

  /* ── the recipe ────────────────────────────────────────────────────── */
  .blocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.4rem; align-items: start; }
  /* What this template keeps and what it drops are one decision, so they are
     read side by side wherever there is room for two columns. */
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem;
          margin-top: 1.1rem; align-items: start; }
  /* Blocks are told apart by a hairline above them, not by four boxes; one
     block per card is filled, and it is the one that says what to leave out. */
  section { border-top: 1px solid var(--hairline); padding-top: 0.55rem; }
  section.drop { background: var(--tint); border-top: 1px solid var(--rule);
                 padding: 0.55rem 0.8rem 0.7rem; }
  h2 { margin: 0 0 0.4rem; font-size: var(--t-label); font-weight: 700;
       letter-spacing: 0.06em; color: var(--accent); }
  h3 { margin: 0 0 0.3rem; font-size: var(--t-body); font-weight: 650; }
  p { margin: 0 0 0.4rem; font-size: var(--t-body); text-wrap: pretty; }
  p:last-child { margin-bottom: 0; }
  ul, ol { margin: 0; padding-left: 1.05rem; }
  li { margin: 0 0 0.25rem; font-size: var(--t-body); }
  li:last-child { margin-bottom: 0; }
  li::marker { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--hairline); margin: 0.8rem 0; }
  /* Monospace runs large at the same size, so this is an optical match to the
     body rather than a fourth step. */
  code { font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem;
         background: #fff; border: 1px solid var(--border); border-radius: 3px;
         padding: 0.05rem 0.3rem; }

  /* A narrow panel gets the same card standing up, not a shrunken one — and
     the pair is the last thing to give up its two columns, because standing
     the two lists apart is the whole argument this card is making. */
  @media (max-width: 720px) {
    .head { grid-template-columns: 1fr; }
    .plan { width: min(var(--frame-w), 100%); }
    .blocks { grid-template-columns: 1fr; gap: var(--gap); }
  }
  @media (max-width: 460px) { .pair { grid-template-columns: 1fr; gap: var(--gap); } }

  /* The recipe is one page and has to stay one page: a rule split across a
     sheet break is a rule somebody reads half of. */
  @page { size: A4 portrait; margin: 16mm; }
  @media print {
    body { padding: 0; }
    h1 { break-after: avoid; }
    section, .pair, .plan { break-inside: avoid; }
    .frame { background: none; border-color: #999; }
    code { border-color: #999; }
  }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
