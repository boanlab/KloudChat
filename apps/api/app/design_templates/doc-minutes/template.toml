kind = "document"
cover_page = false

# 규칙은 서식 지침과 에이전트 지침에 둔다. 검사는 서버 훅이 맡는다.
skills = []
# Run by the server before and after writing (app/skills/README.md).
check_skills = ["gap-check", "grounding-check"]
name = "회의록"
description = "결정·할 일·담당·기한을 남기는 회의록 · 촘촘한 회색 머리"
category = "업무"
fills = ["회의 이름", "일시와 참석자", "다룬 안건"]
example_prompt = "회의록을 정리해 줘. 정해진 것과 아직 정해지지 않은 것을 나누고, 실행 항목에는 담당자와 기한을 적어 줘.\n\n회의와 참석자: "
seed_from = "_document"
layouts = ["cover", "section"]

# English half of the catalogue. The UI picks a side by language;
# the instructions the model follows stay Korean, because the surfaces
# they belong to answer in Korean by default.
name_en = "Meeting minutes"
description_en = "Decisions, actions, owners, dates · compact"
category_en = "Work"
fills_en = ["Meeting", "Date and attendees", "Agenda"]
example_prompt_en = "Write these minutes up. Separate what was decided from what is still open, and give every action an owner and a due date.\n\nMeeting and attendees: "

[wrap]
cover = '<div class="cover"><h1>{title}</h1>{body}</div>'
block = '<section><h2>{title}</h2>{body}</section>'
