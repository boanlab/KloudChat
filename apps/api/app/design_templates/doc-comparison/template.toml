kind = "document"
# The document format it fixes (`doc_formats`): head fields, numbering, the format's
# pipeline, and its genre rule in `genre.md`.
doc_format = "comparison"
cover_page = false

# 규칙은 서식 지침과 에이전트 지침에 둔다. 점수 재계산·빈칸 검사는 뒤에 서버 훅으로 붙는다.
skills = []
# Run by the server before and after writing (app/skills/README.md).
check_skills = ["gap-check", "grounding-check"]
name = "비교·분석 보고서"
description = "대안을 같은 기준으로 견주고 조건과 함께 권고 · 첫해·이듬해 비용과 기준별 비교표"
category = "업무"
fills = ["비교할 대안", "판단 기준(가중치가 있으면 함께)", "대안별 자료"]
example_prompt = "아래 대안들을 비교·분석 보고서로 정리해 줘. 판단 기준은 아래 순서대로 보고, 필수 조건이 있으면 먼저 적용해 줘. 비용은 첫해와 이듬해로 나눠 주고, 자료끼리 값이 다르면 출처와 날짜를 나란히 적어 줘. 권고는 조건과 함께.\n\n대안: \n판단 기준(가중치가 있으면 함께): \n필수 조건: \n자료: "
seed_from = "_document"
layouts = ["cover", "section"]

# English half of the catalogue. The UI picks a side by language;
# the instructions the model follows stay Korean, because the surfaces
# they belong to answer in Korean by default.
name_en = "Comparison report"
description_en = "Weigh options on the same criteria and recommend with conditions · first-year and later-year cost, criterion by criterion"
category_en = "Work"
fills_en = ["Options", "Criteria (with weights, if any)", "Material per option"]
example_prompt_en = "Turn the options below into a comparison report. Judge on the criteria below in this order, and apply the must-haves first if there are any. Split cost into the first year and later years, and where sources disagree show both values with their dates. Recommend with conditions.\n\nOptions: \nCriteria (with weights, if any): \nMust-haves: \nMaterial: "

[wrap]
cover = '<div class="cover"><h1>{title}</h1>{body}</div>'
block = '<section><h2>{title}</h2>{body}</section>'

# 빠진 정보 질문: what to ask before writing when the material does not answer it
# (`services/gap_questions.py`; each detector is a built-in name, keywords, a pattern or
# the judge model). A person's agent edits the same list in its form.
[[questions]]
id = "prices"
label = "대안별 가격"
question = "대안별 가격(요금·견적)을 알려 주세요."
why = "비용으로 고르라고 하셨는데 자료에 금액이 없습니다. 가격을 지어 넣지 않습니다."
placeholder = "[가격]"
detector = { type = "builtin", name = "prices" }

[[questions]]
id = "musts"
label = "필수 조건"
question = "꼭 맞아야 하는 조건은 무엇인가요?"
why = "필수 조건으로 거르라고 하셨는데 어떤 조건인지 자료에 없습니다."
placeholder = "[필수 조건]"
detector = { type = "builtin", name = "musts" }

# 진행 과정 설정 (`services/process_settings.py`): what writing in this 서식 does besides
# writing. A person's agent or template sets the same keys in its form.
[process]
prepass = ["quote-calc", "staffing", "compare-cost", "compare-check"]
checks = ["lead-dates", "compare-cells", "staff-counts", "material-blanks"]
judged = ["judge-bindings"]
amend = ["option-status", "conflict-values", "unverified-options"]
# Diagrams only when the instruction asks for them: a comparison is read from its table.
draws = "when-asked"
conflict_rule = "In the 「자료와 충돌」 section, write the two values side by side with their source, time and measurement conditions, and state in one line which value you followed and why (같은 조건 측정 > 최신 > 소개서). If the conditions differ, adopt neither and leave 「조건 다름」."
