kind = "document"
cover_page = false

# 이 서식이 데려오는 절차 — 카탈로그 스킬의 catalog_key.
# 서식은 모양을 주고 스킬은 그 모양을 채우는 규칙을 준다. 문서 생성 시
# 자동으로 붙고 skills_applied 로 화면에 공지된다.
skills = ["calculation-unit-check", "evidence"]
name = "설문 분석"
description = "표본과 문항을 밝히고, 기술통계에서 교차분석까지 표로 잇는 보고서"
category = "연구"
fills = ["조사 대상", "표본 수", "알고 싶은 것"]
example_prompt = "설문 분석 보고서를 써 줘. 표본과 문항을 먼저 밝히고, 기술통계와 교차분석을 표로 정리해 줘.\n\n조사 대상과 표본 수: "
seed_from = "_document"
layouts = ["cover", "section"]

# English half of the catalogue. The UI picks a side by language;
# the instructions the model follows stay Korean, because the surfaces
# they belong to answer in Korean by default.
name_en = "Survey analysis"
description_en = "Sample and instrument stated, then descriptives through cross-tabs, in tables"
category_en = "Research"
fills_en = ["Respondents", "Sample size", "Question"]
example_prompt_en = "Write a survey analysis. State the sample and the instrument first, then give descriptives and cross-tabs as tables.\n\nRespondents and sample size: "

[wrap]
cover = '<div class="cover"><h1>{title}</h1>{body}</div>'
block = '<section><h2>{title}</h2>{body}</section>'
