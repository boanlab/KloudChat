kind = "document"
name = "안내문·공지"
description = "근거와 협조 요청, 붙임까지 갖춘 공문 형식의 안내문"
category = "업무"
fills = ["알릴 내용", "받는 사람", "시행일"]
example_prompt = "학과 구성원에게 보낼 안내문을 써 줘. 무엇이 언제부터 달라지는지, 받는 사람이 언제까지 무엇을 해야 하는지 분명히 하고, 마지막에 붙임 자료를 적어 줘.\n\n알릴 내용: "
layouts = ["cover", "section"]

# English half of the catalogue. The UI picks a side by language;
# the instructions the model follows stay Korean, because the surfaces
# they belong to answer in Korean by default.
name_en = "Notice"
description_en = "A notice in official form: the grounds, what changes, what to do, what is attached"
category_en = "Work"
fills_en = ["What changes", "Recipients", "Effective date"]
example_prompt_en = "Write a notice for the department. Say what changes and when it takes effect, what the reader has to do and by when, and end with the attachments.\n\nWhat changes: "

[wrap]
cover = '<div class="cover"><h1>{title}</h1>{body}</div>'
block = '<section><h2>{title}</h2>{body}</section>'
