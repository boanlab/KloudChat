<!doctype html>
<!--
  KloudChat document seed — notice.

  A 공문, and a 공문 is judged first on form. Everything here is one of two
  conventions a Korean reader already knows: the double rule under a centred
  title, and the staircase — 1. at the margin, the clause heading and every
  line under it on one indented edge, 가·나·다 inside that. Nothing else is
  added, because the restraint *is* the form: a notice that decorates itself
  stops reading as one that went through an approval line.

  This is the only document in the catalogue whose head is centred, and that
  is deliberate. The minutes seed next to it is asymmetric — left column of
  text, right column of 담당·기한 — and if this title ever moves off centre
  the two become the same document.

  There is no colour field anywhere, and only two places spend the accent: the
  rule under the title and the clause numerals. A notice gets photocopied, and
  what survives a monochrome copier is the numbering and the rules, not the hue.

  The numbering is a CSS counter because the writer only ever sends the words
  inside a clause — a number typed into the text would be wrong the moment a
  clause moves. The last clause is styled as the 붙임 by position rather than
  by a class, since a class is not among the things the writer may send.

  Nothing here executes. Artifacts render in a `sandbox=""` iframe, so the
  whole shape is CSS. See `services/design_templates.py`.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
{{TOKENS}}
    --paper: #ffffff;
    /* Two ink strengths, no literal grey: the heavier rule that separates
       parts of the document, and the hairline that rules a form. */
    --rule: color-mix(in srgb, var(--ink) 26%, transparent);
    --hairline: color-mix(in srgb, var(--ink) 13%, transparent);
    /* One step for the whole staircase: the clause number sits in it, and
       everything belonging to that clause starts on the far side of it.
       Wide enough that a two-digit 10항 does not run into its own heading. */
    --step: clamp(1.1rem, 3.2vw, 1.6rem);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: color-mix(in srgb, var(--ink) 4%, #fff);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1rem;
    /* The widest leading in the catalogue, and the one a Korean notice is
       actually set at. It also carries the serif face the design system may
       pick here: 명조 at body size closes up without this much air. */
    line-height: 1.85;
    /* 한글은 단어 가운데서 끊기면 읽는 속도가 떨어진다. */
    word-break: keep-all;
    overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
    counter-reset: clause;
  }
  .page {
    max-width: 44rem;
    margin: 0 auto;
    padding: clamp(2rem, 6vw, 4.5rem) clamp(1.25rem, 5vw, 3.5rem) 5rem;
    background: var(--paper);
    min-height: 100vh;
  }

  /* ── head: the one centred thing in the catalogue ──────────────── */
  .cover { text-align: center; margin-bottom: clamp(1.8rem, 4vw, 2.8rem); }
  .cover h1 {
    margin: 0;
    padding-bottom: 0.7rem;
    /* 4px rather than 3: at three the browser draws 1px, 1px, 1px and the
       gap disappears at any ordinary pixel density, which leaves the one
       convention this document is built on looking like a plain rule. */
    border-bottom: 4px double var(--accent);
    font-size: clamp(1.45rem, 4.2vw, 2.15rem);
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .cover p {
    margin: 1rem auto 0;
    max-width: 54ch;
    color: var(--muted);
    font-size: 0.98rem;
    line-height: 1.6;
    font-style: normal;
    text-wrap: pretty;
  }
  /* 수신·시행·담당. A grid rather than a table layout so the label column is
     as wide as the longest label and no wider, and so it can stack. */
  .cover table {
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: 1rem;
    width: 100%;
    margin: 1.5rem 0 0;
    text-align: left;
    font-size: 0.92rem;
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }
  .cover thead, .cover tbody, .cover tr { display: contents; }
  /* The head's cells are ruled underneath only; the boxed rules below belong
     to a schedule table, not to a list of who this is for. */
  .cover th, .cover td {
    padding: 0.4rem 0;
    border: 0;
    border-bottom: 1px solid var(--hairline);
    background: transparent;
  }
  .cover th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  /* Under 720px the two columns would squeeze a 20자 수신 line into 8; stack
     the label over its value instead. */
  @media (max-width: 720px) {
    .cover table { grid-template-columns: 1fr; }
    .cover th { padding: 0.5rem 0 0; border-bottom: 0; }
    .cover td { padding: 0 0 0.5rem; }
  }

  /* ── the staircase ─────────────────────────────────────────────── */
  /* The step is the clause's own padding rather than a margin on each of its
     children: a `<table width:100%>` given a left margin is a table one step
     wider than the page it sits on. */
  section { counter-increment: clause; margin: 0 0 1.9rem; padding-left: var(--step); }
  section h2 {
    position: relative;
    /* The heading text starts where the clause's own lines start, and the
       numeral hangs in the step beside them. That step is the structure. */
    margin: 0 0 0.5rem calc(-1 * var(--step));
    padding-left: var(--step);
    font-size: 1.08rem;
    font-weight: 700;
    line-height: 1.5;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  section h2::before {
    content: counter(clause) ".";
    position: absolute;
    left: 0;
    top: 0;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  /* A clause heading on a notice is read by somebody looking for their
     own item, so it holds full ink. */
  h3 { margin: 1.2rem 0 0.35rem; font-size: 1rem; font-weight: 650; }
  p { margin: 0 0 0.8rem; text-wrap: pretty; }
  section > :last-child { margin-bottom: 0; }
  ul, ol { margin: 0 0 0.9rem; padding-left: 1.4rem; }
  li { margin: 0 0 0.25rem; }
  /* 가·나·다 under a numbered clause, and a dash where the order does not
     matter: both are the convention on paper, and a browser that knows
     neither falls back to numbers and discs. */
  ol { list-style-type: hangul; }
  ul { list-style-type: "- "; }
  li::marker { color: var(--accent); }
  strong { font-weight: 700; }
  /* Emphasis in a notice is weight, never colour and never a slope: a slanted
     Korean face is a face nobody chose. */
  em { font-style: normal; font-weight: 700; }
  blockquote {
    margin: 0.9rem 0; padding: 0.1rem 0 0.1rem 0.9rem;
    border-left: 2px solid var(--rule); color: var(--muted); font-size: 0.95rem;
  }

  /* ── the subordinate voice ─────────────────────────────────────── */
  /* One behaviour for every small print in the catalogue: quiet, short
     measure, upright, half a line under whatever it explains. */
  small, figcaption, dd {
    display: block;
    margin-top: 0.5rem;
    max-width: 54ch;
    color: var(--muted);
    font-size: 0.85em;
    line-height: 1.55;
    font-style: normal;
  }

  /* Ruled all round: a notice's table is usually a schedule somebody reads
     across, and an underline-only table loses the column on a photocopy.
     Ruled, not shaded — there is no colour field anywhere in this document,
     and a grey header band is the first thing that makes one look printed
     from a template rather than issued. */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.4rem 0 1rem;
    font-size: 0.94rem;
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }
  th, td { padding: 0.5em 0.65em; border: 1px solid var(--hairline);
           text-align: left; vertical-align: top; }
  th { font-weight: 700; border-bottom-color: var(--rule); }

  /* ── 붙임 ──────────────────────────────────────────────────────── */
  /* The attachments are the last clause. `:not(:first-of-type)` keeps a
     notice that ended up with a single clause from being read as one. */
  section:last-of-type:not(:first-of-type) {
    counter-increment: none;
    margin-top: 2.5rem;
    padding: 1.1rem 0 0;
    border-top: 1px solid var(--rule);
  }
  section:last-of-type:not(:first-of-type) h2 {
    margin-left: 0;
    padding-left: 0;
    font-size: 0.98rem;
    letter-spacing: 0.08em;
  }
  section:last-of-type:not(:first-of-type) h2::before { content: none; }
  /* Attachments are counted 1, 2, 3 — they are enclosures a reader checks
     what arrived against, not sub-items of a clause. */
  section:last-of-type:not(:first-of-type) ol { list-style: decimal; }
  section:last-of-type:not(:first-of-type) li { margin-bottom: 0.1rem; }

  /* The rest of the vocabulary `sanitise` lets through. A block that reaches
     for a caption or a definition list should get typography rather than the
     browser's defaults — an unstyled `<dl>` is how model output starts to
     look like model output. */
  dl { margin: 0 0 1rem; }
  dt { font-weight: 700; }
  dd { margin: 0.2rem 0 0.6rem; }
  hr { border: 0; border-top: 1px solid var(--hairline); margin: 1.4rem 0; }
  /* A line of code is a quotation from a machine, so it has to survive being
     copied out of the page character for character: a fixed-width face, and a
     field that shows where it starts and where it stops. Inline only — `pre`
     is not in the vocabulary, so nothing here can grow into a wall. */
  code {
    font-family: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace);
    font-size: 0.88em;
    padding: 0.05em 0.32em;
    background: color-mix(in srgb, var(--ink) 5%, var(--paper));
    border: 1px solid var(--hairline);
    border-radius: 3px;
    overflow-wrap: anywhere;
  }
  /* A picture is a data URI the server embedded; nothing here fetches from
     outside a sandboxed artifact. */
  figure { margin: 1.2rem 0; break-inside: avoid; }
  /* A page scrolls, so width is the constraint — but a picture taller than the
     paper still breaks across two pages with nothing on the second. */
  figure img { display: block; max-width: 100%; max-height: 60vh; width: auto; height: auto; }
  figcaption { margin-top: 0.5rem; }

  /* ── print: one column, no cover page ──────────────────────────── */
  @page { size: A4 portrait; margin: 22mm 20mm; }
  @media print {
    /* Screen wants air; paper has a fixed height, and a notice that spills its
       붙임 onto a second sheet is a notice somebody staples. Everything below
       is the same layout, set tighter. */
    body { background: #fff; line-height: 1.7; }
    .page { max-width: none; margin: 0; padding: 0; min-height: 0; }
    /* Unlike a report, the head is not a title page: it belongs on the same
       sheet as the first clause, the way a notice is read. */
    .cover { margin-bottom: 8mm; break-after: auto; page-break-after: auto; }
    section { margin-bottom: 1.4rem; break-inside: auto; page-break-inside: auto; }
    h2, h3 { break-after: avoid; page-break-after: avoid; }
    tr, li { break-inside: avoid; page-break-inside: avoid; }
    /* 붙임 split over two sheets stops being a list you can check what you
       received against. */
    section:last-of-type:not(:first-of-type) {
      margin-top: 1.6rem;
      break-inside: avoid;
      page-break-inside: avoid;
    }
  }
</style>
</head>
<body>
<div class="page">
{{BODY}}
</div>
</body>
</html>
