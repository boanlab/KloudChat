<!doctype html>
<!--
  KloudChat deck seed — proposal.

  A deck for a room that decides something. The argument runs problem →
  approach → evidence → ask, so every slide puts its claim in a left rail and
  the evidence beside it: a reviewer scanning the rail reads the case without
  reading the deck. The rail collapses under 720px, which is how the gallery
  preview and a phone see it.

  Nothing in here executes, and nothing needs to: artifacts render in a
  `sandbox=""` iframe, so a JS runtime would be dead code that still had to
  be trusted. Navigation is CSS scroll-snap, which works in the panel, in a
  new tab and in the downloaded file alike.

  `@media print` puts one slide on one landscape page — a proposal is handed
  out as often as it is projected, and "print to PDF" is the export path
  rather than a rendering engine in the API image.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
{{TOKENS}}
    --paper: #ffffff;
    --surface: color-mix(in srgb, var(--ink) 4%, #fff);
    --border: color-mix(in srgb, var(--ink) 16%, transparent);
    --hair: color-mix(in srgb, var(--ink) 9%, transparent);
    --tint: color-mix(in srgb, var(--accent) 8%, transparent);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    scroll-snap-type: y mandatory;
    overflow-y: auto;
    height: 100vh;
  }
  /* Korean breaks between syllables unless it is told not to, which puts the
     second half of a word on the next line. `keep-all` moves the break to a
     space; `break-word` is the escape hatch for a token with no space in it,
     such as a path or an identifier. */
  body { word-break: keep-all; overflow-wrap: break-word; }
  .slide {
    scroll-snap-align: start;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(2rem, 7vh, 5.5rem) clamp(1.5rem, 7vw, 6rem) clamp(4rem, 10vh, 7rem);
    border-bottom: 1px solid var(--hair);
    position: relative;
  }
  /* The one mark that repeats: a short accent tick and the slide's number,
     bottom left, where the rail is. It is the only accent most slides use. */
  .num {
    position: absolute;
    left: clamp(1.5rem, 7vw, 6rem);
    bottom: clamp(1.6rem, 4vh, 3rem);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    color: var(--muted);
  }
  .num::before {
    content: "";
    display: inline-block;
    width: 1.5rem;
    height: 2px;
    margin-right: 0.6rem;
    vertical-align: middle;
    background: var(--accent);
  }

  h2 {
    margin: 0 0 0.7em;
    font-size: clamp(1.3rem, 2.8vw, 2.05rem);
    line-height: 1.2;
    letter-spacing: -0.02em;
    font-weight: 680;
    text-wrap: balance;
  }
  h3 {
    margin: 0 0 0.5em;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  p { margin: 0 0 0.75em; font-size: clamp(0.98rem, 1.35vw, 1.12rem); text-wrap: pretty; }
  p:last-child { margin-bottom: 0; }
  ul, ol { margin: 0; padding-left: 1.15em; }
  li { margin: 0 0 0.55em; font-size: clamp(0.98rem, 1.45vw, 1.15rem); }
  li:last-child { margin-bottom: 0; }
  li::marker { color: var(--accent); }
  strong { font-weight: 650; }
  blockquote { margin: 0; font-size: clamp(1.2rem, 2.4vw, 1.8rem); line-height: 1.35; text-wrap: balance; }
  small, .note { font-size: clamp(0.82rem, 1.1vw, 0.95rem); color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: clamp(0.86rem, 1.15vw, 1rem); }
  th, td { padding: 0.55em 0.7em; border-bottom: 1px solid var(--hair); text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  thead th { border-bottom: 2px solid var(--border); }

  /* ── the rail ──────────────────────────────────────────────────────
     Claim on the left, evidence on the right. Below 720px there is no room
     for two columns, so the heading simply sits above its slide. */
  @media (min-width: 721px) {
    .slide {
      display: grid;
      grid-template-columns: minmax(9rem, 21%) 1fr;
      column-gap: clamp(1.75rem, 4vw, 3.5rem);
      align-content: center;
    }
    .slide > * { grid-column: 2; }
    .slide > h2 { grid-column: 1; align-self: start; margin: 0; padding-top: 0.1em; }
    /* An absolutely positioned child that has been given a column is placed
       against that column; the number belongs to the slide, so it keeps none. */
    .slide > .num { grid-column: auto; }
    /* A title page is not an argument; the cover keeps the full width. */
    .slide.cover { display: flex; }
  }

  /* ── cover ─────────────────────────────────────────────────────────
     What is proposed, and who is being asked to decide it. */
  .slide.cover { background: var(--surface); }
  .slide.cover h2 { font-size: clamp(1.9rem, 5vw, 3.3rem); max-width: 24ch; margin-bottom: 0.5em; }
  .slide.cover .lead { color: var(--muted); font-size: clamp(1rem, 1.7vw, 1.25rem); max-width: 44ch; }
  .slide.cover .meta {
    margin: 2rem 0 0;
    padding-top: 0.9rem;
    border-top: 1px solid var(--border);
    max-width: 40ch;
    letter-spacing: 0.02em;
    color: var(--muted);
    font-size: clamp(0.82rem, 1.1vw, 0.95rem);
  }

  /* ── compare ───────────────────────────────────────────────────────
     Left is what happens now, right is what is proposed. The divider is the
     accent, so the side being argued for is the side the eye lands on. */
  .slide.compare .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(1.25rem, 3vw, 2.5rem);
  }
  .slide.compare .cols > div + div {
    padding-left: clamp(1rem, 2vw, 1.75rem);
    border-left: 2px solid var(--accent);
  }
  .slide.compare .cols > div + div h3 { color: var(--accent); }
  @media (max-width: 720px) {
    .slide.compare .cols { grid-template-columns: 1fr; }
    .slide.compare .cols > div + div {
      padding: 1rem 0 0;
      border-left: 0;
      border-top: 2px solid var(--accent);
    }
  }

  /* ── figure ────────────────────────────────────────────────────────
     One value or one claim, large, with the line that says where it came
     from directly under it. A number nobody can source is not evidence. */
  .slide.figure .claim {
    margin: 0;
    font-size: clamp(2rem, 6.5vw, 4rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    font-weight: 700;
    text-wrap: balance;
  }
  .slide.figure blockquote { font-size: clamp(1.7rem, 4.6vw, 3rem); line-height: 1.15; }
  .slide.figure .note {
    margin: 1.2rem 0 0;
    padding-top: 0.9rem;
    border-top: 2px solid var(--accent);
    max-width: 46ch;
  }

  /* ── ask ───────────────────────────────────────────────────────────
     The last slide, and the only one on a coloured ground: what is being
     requested, from whom, by when. */
  .slide.ask { background: var(--tint); }
  .slide.ask li { font-size: clamp(1rem, 1.6vw, 1.22rem); margin-bottom: 0.75em; }
  .slide.ask li strong { color: var(--accent); }
  .slide.ask .note { margin-top: 1.4rem; }

  /* ── print: one slide per page ─────────────────────────────────────
     The rail is restated here rather than inherited, because a print box
     that measures narrow would otherwise drop it and scramble the columns. */
  @page { size: A4 landscape; margin: 12mm; }
  @media print {
    body { background: #fff; height: auto; overflow: visible; }
    .slide {
      display: grid;
      grid-template-columns: minmax(28mm, 22%) 1fr;
      column-gap: 8mm;
      align-content: start;
      min-height: auto;
      height: auto;
      page-break-after: always;
      break-after: page;
      border-bottom: 0;
      padding: 6mm 8mm 10mm;
    }
    .slide > * { grid-column: 2; }
    .slide > h2 { grid-column: 1; align-self: start; margin: 0; }
    .slide > .num { grid-column: 2; }
    .slide.cover { display: block; background: #fff; }
    .slide:last-child { page-break-after: auto; break-after: auto; }
    /* A printer may drop a background and never drops a rule, so the ask is
       framed on paper instead of tinted. */
    .slide.ask { background: #fff; border: 1.5pt solid var(--accent); padding: 8mm; }
    .num { position: static; margin-top: 1.4em; }
  }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
