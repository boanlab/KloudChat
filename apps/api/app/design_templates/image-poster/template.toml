kind = "image"
name = "포스터"
description = "한 장으로 시선을 잡는 그림. 글자는 넣지 않고 여백을 남깁니다"
category = "홍보"
fills = ["무엇을 알리는지", "분위기"]
example_prompt = "{subject}을 알리는 포스터 그림. {mood} 분위기로, 위쪽은 제목 자리로 비워 줘."
layouts = ["cover"]
prompt_suffix = "poster composition, one dominant subject, clear space at the top for a title, printed paper texture, no text, no lettering, no logos"

# English half of the catalogue. The UI picks a side by language;
# the instructions the model follows stay Korean, because the surfaces
# they belong to answer in Korean by default.
name_en = "Poster"
description_en = "One image that carries a room. No lettering, space left for a title"
category_en = "Promotion"
fills_en = ["What it announces", "Mood"]
example_prompt_en = "Poster artwork announcing {subject}, {mood}, with the top left clear for a title."

[defaults]
aspect = "9:16"
style = "일러스트"

[[arguments]]
name = "subject"
label = "무엇을"
label_en = "Subject"
default = "학과 연구 성과 발표회"
default_en = "a department research showcase"

[[arguments]]
name = "mood"
label = "분위기"
label_en = "Mood"
default = "차분하고 단정한"
default_en = "calm and orderly"
options = ["차분하고 단정한", "밝고 활기찬", "묵직하고 고전적인"]
options_en = ["calm and orderly", "bright and lively", "weighty and classical"]
