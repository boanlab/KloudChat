kind = "image"
name = "표지 그림"
description = "보고서 표지나 슬라이드 배경. 가운데를 비워 글자를 얹을 수 있습니다"
category = "문서"
fills = ["문서 주제", "느낌"]
example_prompt = "{topic}에 관한 문서의 표지 바탕. {feel} 느낌으로, 가운데는 제목 자리로 비워 줘."
layouts = ["cover"]
prompt_suffix = "abstract document-cover background, calm mid-tone contrast, uncluttered centre reserved for a title, subtle texture, no text, no lettering, no logos, no faces"

# English half of the catalogue. The UI picks a side by language;
# the instructions the model follows stay Korean, because the surfaces
# they belong to answer in Korean by default.
name_en = "Cover image"
description_en = "A ground for a report cover or slide background, centre left clear"
category_en = "Documents"
fills_en = ["Document topic", "Feel"]
example_prompt_en = "A cover ground for a document about {topic}, {feel}, with the centre left clear for a title."

[defaults]
aspect = "4:3"
style = "미니멀"

[[arguments]]
name = "topic"
label = "문서 주제"
label_en = "Document topic"
default = "연구실 장비 관리"
default_en = "lab equipment management"

[[arguments]]
name = "feel"
label = "느낌"
label_en = "Feel"
default = "정돈된 리듬"
default_en = "an orderly rhythm"
options = ["정돈된 리듬", "부드러운 결", "단단한 구조"]
options_en = ["an orderly rhythm", "a soft grain", "a firm structure"]
