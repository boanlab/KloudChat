kind = "deck"
name = "편집형 덱"
description = "제목 아래를 가로지르는 룰 하나, 본문은 왼쪽 일곱 칸. 오른쪽 다섯 칸은 끝까지 비워 두는 밝은 발표 자료"
category = "발표"
fills = ["주제", "청중", "발표 시간"]
example_prompt = "팀 케이스 분석을 15분 발표 자료로 만들어 줘. 청중은 같은 수업을 듣는 학생들이고, 같은 파일을 A4로 뽑아 나눠 볼 거야.\n\n주제: "
seed_from = "_deck"
layouts = ["cover", "bullets", "quote", "split", "table"]

# English half of the catalogue. The UI picks a side by language;
# the instructions the model follows stay Korean, because the surfaces
# they belong to answer in Korean by default.
name_en = "Editorial deck"
description_en = "One hairline rule under the title, body on the left seven columns, the right five left empty"
category_en = "Presentation"
fills_en = ["Topic", "Audience", "Length"]
example_prompt_en = "Turn our team case analysis into a 15-minute talk. The audience is the rest of the class, and the same file gets printed on A4 to pass around.\n\nTopic: "

# The shape this template's own instructions promise. `services/lint` reads
# these instead of its general bounds, so the checklist and the checker
# cannot disagree about what counts as a crowded slide.
#
# No character bound of its own, deliberately. The body runs on seven of
# twelve columns and the list hangs its dash, so a long item wraps and stays
# aligned rather than breaking the slide — this deck's rule is "two lines,
# not three", which the checker's general bound already sits inside.
[limits]
max_bullets = 5

[wrap]
cover = '<section class="slide cover"><h2>{title}</h2>{body}<span class="num">{n}</span></section>'
block = '<section class="slide {layout}"><h2>{title}</h2>{body}<span class="num">{n}</span></section>'
