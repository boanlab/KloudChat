<!doctype html>
<!--
  KloudChat deck seed — editorial.

  No script, by design: artifacts render in a `sandbox=""` iframe, so a
  keyboard runtime would be dead code that still had to be trusted. The deck
  navigates by CSS scroll-snap, which works in the panel, in a new tab, and
  in the downloaded file alike.

  `@media print` puts one slide on one landscape page, so "print to PDF" is
  the export path rather than a rendering engine in the API image.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
{{TOKENS}}
    --bg: #ffffff;
    --surface: #f7f7f5;
    --border: color-mix(in srgb, var(--ink) 12%, transparent);
    --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    scroll-snap-type: y mandatory;
    overflow-y: auto;
    height: 100vh;
  }
  /* Korean breaks between syllables unless it is told not to, which puts the
     second half of a word on the next line. `keep-all` moves the break to a
     space; `break-word` is the escape hatch for a token with no space in it,
     such as a path or an identifier. */
  body { word-break: keep-all; overflow-wrap: break-word; }
  .slide {
    scroll-snap-align: start;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 7vh 8vw 9vh;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  /* A projector is wider than anybody reads in one sweep. */
  .slide > * { max-width: 58rem; }
  .slide::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 6px;
    background: var(--accent);
  }
  .num {
    position: absolute;
    right: 8vw;
    bottom: 4vh;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  h2 {
    margin: 0 0 0.7em;
    font-size: clamp(1.6rem, 3.4vw, 2.7rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  /* A sub-heading introduces the lines under it, so it cannot be smaller
     or fainter than they are. */
  h3 { margin: 1.4em 0 0.4em; font-size: clamp(1.1rem, 1.7vw, 1.3rem);
       font-weight: 650; }
  p { margin: 0 0 0.8em; font-size: clamp(1rem, 1.5vw, 1.15rem); text-wrap: pretty; }
  ul, ol { margin: 0; padding-left: 1.1em; }
  li { margin: 0 0 0.55em; font-size: clamp(1rem, 1.5vw, 1.2rem); text-wrap: pretty; }
  li::marker { color: var(--accent); }
  strong { font-weight: 650; }
  blockquote { margin: 0; font-size: clamp(1.5rem, 3vw, 2.2rem); line-height: 1.3; text-wrap: balance; }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { padding: 0.5em 0.7em; border-bottom: 1px solid var(--border); text-align: left; }
  /* Figures in a column are read down, not across; without this they
     wander by a fraction of a character each row. */
  td { font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600;
       border-bottom: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); }

  /* ── cover ─────────────────────────────────────────────────────── */
  .slide.cover { background: var(--surface); }
  .slide.cover h2 { font-size: clamp(2rem, 5vw, 3.6rem); }
  .slide.cover .lead { color: var(--muted); font-size: clamp(1rem, 1.8vw, 1.3rem); max-width: 46ch; }

  /* ── quote ─────────────────────────────────────────────────────── */
  .slide.quote { background: var(--accent-soft); }
  /* The quote is the slide; its heading is a kicker above it, not a rival. */
  .slide.quote h2 { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.06em;
                    color: var(--muted); margin-bottom: 1.2em; }
  .slide.quote blockquote::before { content: "“"; color: var(--accent); }
  .slide.quote blockquote::after { content: "”"; color: var(--accent); }

  /* ── split ─────────────────────────────────────────────────────── */
  .slide.split .cols { display: grid; gap: 2.5rem; grid-template-columns: 1fr 1fr; }
  @media (max-width: 720px) { .slide.split .cols { grid-template-columns: 1fr; } }

  /* ── print: one slide per page ─────────────────────────────────── */
  /* The rest of the vocabulary `sanitise` lets through. A block that reaches
     for a caption or a definition list should get typography rather than the
     browser's defaults — an unstyled `<dl>` is how model output starts to
     look like model output. */
  dl { margin: 0 0 1rem; }
  dt { font-weight: 650; }
  dd { margin: 0 0 0.5rem; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--border); margin: 1.4rem 0; }
  /* A picture is a data URI the server embedded; nothing here fetches from
     outside a sandboxed artifact. */
  figure { margin: 1.2rem 0; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 0.5rem; font-size: 0.86em; color: var(--muted); }

  @page { size: A4 landscape; margin: 12mm; }
  @media print {
    body { height: auto; overflow: visible; }
    .slide {
      min-height: auto;
      height: auto;
      page-break-after: always;
      break-after: page;
      border-bottom: 0;
      padding: 8mm 10mm;
    }
    .slide:last-child { page-break-after: auto; break-after: auto; }
    .num { position: static; margin-top: 1.5em; }
  }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
