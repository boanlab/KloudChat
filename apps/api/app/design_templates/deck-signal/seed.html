<!doctype html>
<!--
  KloudChat deck seed — signal.

  A dark room deck: high contrast, fewer words, the accent doing the pointing.
  Same contract as the editorial seed — no script, scroll-snap navigation,
  one slide per printed page. See `services/design_templates.py`.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
{{TOKENS}}
    --bg: #0e1116;
    --surface: #161b22;
    --paper: #f5f6f7;
    --border: rgba(255,255,255,0.10);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--paper);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    scroll-snap-type: y mandatory;
    overflow-y: auto;
    height: 100vh;
  }
  /* Korean breaks between syllables unless it is told not to, which puts the
     second half of a word on the next line. `keep-all` moves the break to a
     space; `break-word` is the escape hatch for a token with no space in it,
     such as a path or an identifier. */
  body { word-break: keep-all; overflow-wrap: break-word; }
  .slide {
    scroll-snap-align: start;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8vh 8vw 10vh;
    position: relative;
  }
  /* A projector is wider than anybody reads in one sweep. */
  .slide > * { max-width: 58rem; }
  .num {
    position: absolute; right: 8vw; bottom: 4vh;
    font-size: 0.75rem; color: rgba(255,255,255,0.35); letter-spacing: 0.12em;
  }
  h2 {
    margin: 0 0 0.6em;
    font-size: clamp(1.7rem, 4vw, 3rem);
    line-height: 1.1;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }
  h2::after {
    content: ""; display: block; width: 2.4rem; height: 3px;
    margin-top: 0.5em; background: var(--accent);
  }
  /* A tracked, coloured line above the text: an eyebrow, so smaller is
     right — but it has to carry weight to read as a label. */
  h3 { margin: 1.2em 0 0.3em; font-size: 0.95rem; font-weight: 700;
       letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
  p { margin: 0 0 0.7em; font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      color: rgba(245,246,247,0.82); text-wrap: pretty; }
  ul, ol { margin: 0; padding-left: 1em; }
  li { margin: 0 0 0.7em; font-size: clamp(1.05rem, 1.7vw, 1.35rem); text-wrap: pretty; }
  li::marker { color: var(--accent); }
  strong { color: #fff; font-weight: 650; }
  blockquote { margin: 0; font-size: clamp(1.6rem, 3.6vw, 2.6rem); line-height: 1.25;
               text-wrap: balance; }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { padding: 0.55em 0.7em; border-bottom: 1px solid var(--border); text-align: left; }
  td { font-variant-numeric: tabular-nums; }
  th { color: var(--accent); font-weight: 600; }

  .slide.cover { background: linear-gradient(180deg, var(--surface), var(--bg)); }
  .slide.cover h2 { font-size: clamp(2.1rem, 5.5vw, 4rem); }
  .slide.cover h2::after { display: none; }
  .slide.cover .lead { color: rgba(245,246,247,0.6); max-width: 44ch; }

  .slide.quote { background: var(--surface); }
  .slide.quote h2 { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.1em;
                    text-transform: uppercase; color: rgba(245,246,247,0.45);
                    margin-bottom: 1.4em; }
  .slide.quote h2::after { display: none; }
  .slide.quote blockquote { color: var(--accent); }

  .slide.split .cols { display: grid; gap: 2.5rem; grid-template-columns: 1fr 1fr; }
  @media (max-width: 720px) { .slide.split .cols { grid-template-columns: 1fr; } }

  /* The rest of the vocabulary `sanitise` lets through. A block that reaches
     for a caption or a definition list should get typography rather than the
     browser's defaults — an unstyled `<dl>` is how model output starts to
     look like model output. */
  dl { margin: 0 0 1rem; }
  dt { font-weight: 650; }
  dd { margin: 0 0 0.5rem; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--border); margin: 1.4rem 0; }
  /* A picture is a data URI the server embedded; nothing here fetches from
     outside a sandboxed artifact. */
  figure { margin: 1.2rem 0; text-align: center; }
  /* A slide is one screen. A portrait picture at full width is twice that,
     and it takes the slide's own box with it — scroll-snap stops landing on
     slide boundaries and print puts one slide across two pages. Height is
     what has to be capped here, not width. */
  figure img { display: block; margin: 0 auto; max-width: 100%; max-height: 52vh;
               width: auto; height: auto; }
  figcaption { margin-top: 0.5rem; font-size: 0.86em; color: var(--muted); }

  @page { size: A4 landscape; margin: 10mm; }
  @media print {
    /* Printers do not lay ink on the dark; the deck inverts for paper. */
    body { background: #fff; color: #111; height: auto; overflow: visible; }
    .slide, .slide.cover, .slide.quote { background: #fff; min-height: auto; height: auto;
      page-break-after: always; break-after: page; padding: 8mm 10mm; }
    .slide:last-child { page-break-after: auto; break-after: auto; }
    p { color: #333; }
    strong { color: #000; }
    .num { position: static; margin-top: 1.5em; color: #666; }
  }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
