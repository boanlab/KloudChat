# A deck: written by `deck.py` in one pass (`make`: it plans and offers, or writes the
# approved outline), carried slides put back on a restructure, stored. A follow-up revises
# it: routed, its slides rewritten.

name = "deck"
make = ["deck-write", "deck-carry", "deck-save"]
revise = [
    "revise-load", "revise-route", "revise-widen", "revise-rewrite", "consistency",
    "revise-save",
]
