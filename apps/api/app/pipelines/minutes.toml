# 회의록 (agent `minutes`, format `minutes`): dates resolved from the meeting day, action rows
# repaired by code before the verify stage and again after it.

name = "minutes"
formats = ["minutes"]
agents = ["minutes"]
pre = ["check:gaps", "gap-card"]
plan = ["research", "material", "outline"]
write = [
    "research", "material", "approved-plan", "calc", "announce", "settle", "prepass",
    "writer-notes", "draft", "sections", "figures", "additions", "normalize", "title-block",
    "checks-plan", "minutes-repair", "check:grounding", "format-find", "verify",
    "minutes-reground", "check:grounding-again", "format-amend", "format-step", "quality",
    "report-save",
]
revise = [
    "revise-load", "revise-route", "revise-widen", "revise-rewrite", "consistency",
    "revise-save",
]
prepass = ["date-calc"]
checks = ["lead-dates", "minutes-rows", "material-blanks"]
judged = ["judge-owners"]

[options]
# Diagrams only when the instruction asks for them: a 회의록 draws none by itself.
draws = "when-asked"

# What each step of the drawn chain does, said for the person (display only).
[summary]
material = "올린 녹음 기록·메모를 읽습니다"
question = "회의 날짜처럼 빠진 정보가 있으면 먼저 물어봅니다"
compute = "「다음 주 금요일」 같은 날짜를 회의일 기준으로 계산해 둡니다"
write = "회의록을 씁니다"
check = "할 일마다 담당자·기한과 근거를 확인합니다"
