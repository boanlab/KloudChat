# Build overlay — every image from this checkout instead of the registry.
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.build.yml up -d --build
#
# Tagged `:local` so a build never sits in the cache under a published
# version's name; `pull_policy: build` keeps compose from pulling.
services:
  api:
    image: boanlab/kloudchat-api:local
    pull_policy: build
    build:
      context: ./apps/api
      dockerfile: Dockerfile

  print:
    image: boanlab/kloudchat-print:local
    pull_policy: build
    build:
      context: ./apps/print
      dockerfile: Dockerfile

  web:
    image: boanlab/kloudchat-web:local
    pull_policy: build
    build:
      context: ./apps/web
