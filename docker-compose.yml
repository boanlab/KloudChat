# KloudChat — web, API, printer and database, from the published images.
#
#   docker compose up -d
#
# Models and tools live in KloudChat-LLM, reached through one gateway URL
# (BACKEND_BASE_URL in .env, or the address saved under Settings → System →
# Integrations). With that backend down, sign-in, history, workspace and
# settings keep working; model calls and tools report "not connected".
#
# `latest` moves with every push to main. Pin a version tag in production.
# To build from this checkout, overlay docker-compose.build.yml.
name: kloudchat

services:
  db:
    container_name: kloudchat-db
    image: postgres:16.13
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KCHAT_DB_USER:-kchat}
      POSTGRES_PASSWORD: ${KCHAT_DB_PASSWORD:-kchat}
      POSTGRES_DB: kchat
    ports:
      # 5433: 5432 is commonly taken by a vector database on the same host.
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KCHAT_DB_USER:-kchat} -d kchat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bind mounts are created root-owned; the API runs as uid 1000.
  init:
    container_name: kloudchat-init
    image: alpine:3.20
    restart: 'no'
    command: ["sh", "-c", "mkdir -p /d/files /d/uv-cache && chown -R 1000:1000 /d/files /d/uv-cache"]
    volumes:
      - ./data:/d

  api:
    container_name: kloudchat-api
    image: boanlab/kloudchat-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "8100:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENV: ${KCHAT_ENV:-dev}
      DATABASE_URL: postgresql+asyncpg://${KCHAT_DB_USER:-kchat}:${KCHAT_DB_PASSWORD:-kchat}@kloudchat-db:5432/kchat
      JWT_SECRET: ${KCHAT_JWT_SECRET:?set KCHAT_JWT_SECRET — openssl rand -hex 32}
      SIGNUP_MODE: ${KCHAT_SIGNUP_MODE:-approval}
      DEFAULT_CHAT_MODEL: ${KCHAT_DEFAULT_CHAT_MODEL:-local/qwen3.6-35b}
      # Per-surface defaults. Empty falls back to DEFAULT_CHAT_MODEL.
      DEFAULT_REPORT_MODEL: ${KCHAT_DEFAULT_REPORT_MODEL:-}
      DEFAULT_SLIDES_MODEL: ${KCHAT_DEFAULT_SLIDES_MODEL:-}
      DEFAULT_IMAGE_MODEL: ${KCHAT_DEFAULT_IMAGE_MODEL:-google/gemini-2.5-flash-image}
      DEFAULT_AUDIO_MODEL: ${KCHAT_DEFAULT_AUDIO_MODEL:-openai/gpt-audio-mini}
      DEFAULT_VIDEO_MODEL: ${KCHAT_DEFAULT_VIDEO_MODEL:-google/veo-3.1-lite}
      # Conversation titles and memory extraction. A name the gateway does not
      # serve falls back to the session's own model.
      TITLE_MODEL: ${KCHAT_TITLE_MODEL:-local/qwen3.6-35b}
      # Applied only when the database holds no accounts. Blank: the first
      # signup becomes the administrator.
      BOOTSTRAP_ADMIN_EMAIL: ${KCHAT_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${KCHAT_ADMIN_PASSWORD:-}
      # 1 credit = $0.00001; 1,000,000 ≈ $10/month.
      DEFAULT_MONTHLY_CREDITS: ${KCHAT_DEFAULT_MONTHLY_CREDITS:-1000000}
      COOKIE_SECURE: ${KCHAT_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${KCHAT_CORS_ORIGINS:-["http://localhost:5173"]}
      # The master key never leaves this container. A value saved in the admin
      # screen is stored in the database and wins over this without a restart.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      # Bootstrap value; the admin screen overrides it. A tool with no URL is
      # absent from the tool list rather than broken.
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-}
      # Blank disables the printer; PDFs then come from the structural renderer.
      PRINT_BASE_URL: ${KCHAT_PRINT_BASE_URL:-http://kloudchat-print:8200}
      FILE_STORAGE_DIR: /srv/data/files
      # Only the date the model is told each turn. Timestamps stay UTC.
      TIMEZONE: ${KCHAT_TIMEZONE:-Asia/Seoul}
      # Path to a mounted GeoLite2 City .mmdb. Empty: no region lookup.
      GEOIP_DATABASE: ${KCHAT_GEOIP_DATABASE:-}
    # `default` reaches the database, the gateway and the internet; `printer`
    # is the only way to the print service.
    #
    # KloudChat-LLM's docker network is not joined, even on a shared host: the
    # backend is reached by address through its gateway port (BACKEND_BASE_URL)
    # so this stack deploys the same way on any machine. On a shared host use
    # host.docker.internal rather than a public domain — a TLS proxy in front
    # of one commonly times out long document sections at 60 seconds.
    networks:
      - default
      - printer
    volumes:
      # Uploaded originals. Extracted text lives in the database.
      - ./data/files:/srv/data/files
      # MCP stdio server scripts, spawned by the connector runtime.
      - ./mcp:/srv/mcp:ro
      # uv's cache for PEP 723 script dependencies.
      - ./data/uv-cache:/srv/data/uv-cache
    # Migrations on boot assume a single instance; with replicas, run
    # `alembic upgrade head` as its own job.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8100"

  # Headless Chromium: finished HTML in, PDF out. It opens model-authored
  # markup, so it gets no published port, no database, no secrets, and a
  # network with no route out; apps/print/main.py also aborts every request
  # inside the browser.
  print:
    container_name: kloudchat-print
    image: boanlab/kloudchat-print:latest
    restart: unless-stopped
    networks:
      - printer

  # The only thing the browser talks to: static bundle plus a proxy for /api
  # and /llm.
  web:
    container_name: kloudchat-web
    image: boanlab/kloudchat-web:latest
    restart: always
    depends_on:
      - api
    environment:
      KCHAT_API_URL: ${KCHAT_API_URL:-http://kloudchat-api:8100}
      # Hops allowed to name the client in X-Forwarded-For. Narrow to the edge
      # proxy's address wherever the web port is reachable by anyone else.
      KCHAT_TRUSTED_PROXIES: ${KCHAT_TRUSTED_PROXIES:-set_real_ip_from 10.0.0.0/8; set_real_ip_from 172.16.0.0/12; set_real_ip_from 192.168.0.0/16; set_real_ip_from 127.0.0.0/8; set_real_ip_from ::1/128; set_real_ip_from fc00::/7;}
    ports:
      - "${KCHAT_WEB_PORT:-5173}:80"

networks:
  default:
  # `internal`: no gateway, so nothing on this network can reach outside it.
  printer:
    internal: true
