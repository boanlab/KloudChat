version: 2

# Grouped and weekly, so a security update is not buried under patch bumps.
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # React and its type packages move together, or `tsc -b` fails.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'react-router-dom']
      build-tooling:
        patterns: ['vite', '@vitejs/*', 'typescript', 'oxlint', 'tailwindcss', '@tailwindcss/*']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  # The Dockerfiles pin base image tags; this is what notices they moved.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/print
      - /apps/web
    schedule:
      interval: weekly
      day: monday
