# Publishes the user guide to GitHub Pages.
#
# website/ is built and handed straight to Pages; no build output is committed
# and there is no gh-pages branch.
#
# Requires Settings → Pages → Source set to "GitHub Actions". The site is a
# project site at https://boanlab.github.io/KloudChat/, so it does not take the
# organization's single boanlab.github.io site.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  # Republish without a code change, or preview from a fork.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a later push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://boanlab.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      # A fork builds for its own Pages address, so previewing needs no edit here.
      - name: Resolve the site address
        run: |
          if [ "$GITHUB_REPOSITORY" != "boanlab/KloudChat" ]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            name="${GITHUB_REPOSITORY##*/}"
            echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
            echo "SITE_BASE_URL=/${name}/" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
