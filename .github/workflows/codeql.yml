name: CodeQL

# Weekly as well as per push: most new findings come from updated queries.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block, so repeat `contents`.
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          # security-extended: request forgery, path traversal, unsafe deserialization.
          queries: security-extended

      # Interpreted languages: no autobuild step.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
