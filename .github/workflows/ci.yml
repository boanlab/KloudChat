name: CI

# One job per app, so a red job names the surface that broke. A pull request runs the jobs its
# files need (`changes`, mapped by .github/ci/changes.sh); a push to main, a manual run and the
# release's own verify run everything. `CI ok` sums them up: the one check to require.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A manual release, or a tag on a commit CI never ran on, runs these same checks first.
  workflow_call:

# A new push to a PR cancels the in-flight run; `main` keeps its full history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.pick.outputs.api }}
      web: ${{ steps.pick.outputs.web }}
      site: ${{ steps.pick.outputs.site }}
      images: ${{ steps.pick.outputs.images }}
      images_any: ${{ steps.pick.outputs.images_any }}
    steps:
      # Full history: the diff base is not in a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to run
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Only a pull request is narrowed; main, manual runs and releases run everything.
          if [ "$EVENT" != "pull_request" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "$EVENT: running everything"
            .github/ci/changes.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merged into its base, so this is exactly what the PR changes.
          git diff --name-only "$BASE" "$HEAD" > "$RUNNER_TEMP/changed"
          echo "Changed files:"; sed 's/^/  /' "$RUNNER_TEMP/changed"
          .github/ci/changes.sh < "$RUNNER_TEMP/changed" | tee -a "$GITHUB_OUTPUT"

  web:
    name: Web · lint, typecheck, build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/web-setup

      - name: Lint
        run: npm run lint

      # Vite's path aliases, and every e2e spec in exactly one CI group or listed as live
      # (`playwright.ci.config.ts` refuses to load otherwise).
      - name: Test configs
        run: npm run test:config

      - name: Unit tests
        run: npm run test:unit

      # `tsc -b && vite build`: the type check is part of the build; `tsc -b` checks the app,
      # `vite.config.ts` and the e2e specs (`tsconfig.json` references all three).
      - name: Typecheck and build
        run: npm run build

  # The fixture suite (`apps/web/playwright.ci.config.ts`): one build and one
  # `vite preview` per job, the projects split over five jobs by their measured time
  # (`E2E_SHARD`, apps/web/e2e/shard-weights.json). Each job builds for itself: `vite build`
  # is shorter than passing `dist/` between jobs.
  web-e2e:
    name: Web · e2e ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/web-setup
        with:
          browser: 'true'

      # The type check runs once, in the job above.
      - name: Build
        run: npx vite build

      # One retry: a test that passes only on retry is reported as flaky (a warning
      # annotation and the HTML report), not hidden.
      - name: Test
        env:
          E2E_PREBUILT: '1'
          E2E_SHARD: ${{ matrix.shard }}
        run: npx playwright test --config playwright.ci.config.ts

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/web/playwright-report/
          retention-days: 7

  # The HWP editor itself (rhwp-studio), built as the web image builds it and served under
  # its own CSP: one spec opens a document in it, edits and saves it back. The sharded
  # suite skips that spec (no studio in its bundle).
  web-hwp:
    name: Web · HWP editor
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/web-setup
        with:
          browser: 'true'

      - name: Build the app and the editor
        run: npx vite build && ./rhwp/build-studio.sh dist/rhwp

      - name: Test
        env:
          E2E_PREBUILT: '1'
        run: npx playwright test -c playwright.ci.config.ts --project 'hwp-studio/*'

  api:
    name: API · lint, tests
    needs: changes
    if: needs.changes.outputs.api != 'none'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      # Runtime dependencies too: the tests import `app.services.*`.
      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      # `docs`: a change to docs/ or website/ only; the tests that read those.
      - name: Test
        env:
          SCOPE: ${{ needs.changes.outputs.api }}
        run: |
          if [ "$SCOPE" = docs ]; then
            mapfile -t reads_docs < <(grep -lE 'parents\[[0-9]\] */ *"(docs|website)"|build_help' tests/*.py)
            pytest -q "${reads_docs[@]}"
          else
            pytest -q
          fi

  scripts:
    name: Scripts · shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The only gate the hand-run integration scripts get. `error` only:
      # they pass unquoted ids and URLs by design.
      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh scripts/lib/*.sh .github/ci/*.sh

  images:
    name: Image · build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.images_any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build only; release.yml publishes. No registry credentials here, so a
      # fork's pull request cannot push an image.
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          push: false
          # the media worker is tested inside its own image (stock ffmpeg, generated clip)
          load: ${{ matrix.name == 'media' }}
          tags: ${{ matrix.name == 'media' && 'kloudchat-media:ci' || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Test the media worker with its own ffmpeg
        if: matrix.name == 'media'
        run: >-
          docker run --rm -v "$PWD/apps/media:/t:ro" -w /t kloudchat-media:ci
          python -m unittest discover -s tests -v

  compose:
    name: Compose · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Interpolation and schema check. KCHAT_JWT_SECRET is required (`:?`).
      - name: Validate compose files
        env:
          KCHAT_JWT_SECRET: ci-placeholder-not-a-secret
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml \
                         -f docker-compose.dev.yml config -q

  # The user guide, built as docs.yml builds it for Pages (that workflow publishes on main).
  site:
    name: Docs · build site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm run build

  # The one check to require: green when every job either passed or was skipped because the
  # change did not need it. A job that should have run and did not (or `changes` itself
  # failing) is red.
  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, web, web-e2e, web-hwp, api, scripts, images, compose, site]
    runs-on: ubuntu-latest
    steps:
      - name: Check every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          out = needs["changes"].get("outputs", {})
          if needs["changes"]["result"] != "success":
              sys.exit("changes did not run: nothing is known about what this change needs")
          wanted = {
              "web": out.get("web") == "true", "web-e2e": out.get("web") == "true",
              "web-hwp": out.get("web") == "true", "api": out.get("api") != "none",
              "images": out.get("images_any") == "true", "site": out.get("site") == "true",
              "scripts": True, "compose": True,
          }
          bad = []
          for job, need in wanted.items():
              result = needs[job]["result"]
              ok = result == "success" or (result == "skipped" and not need)
              print(f"{job:8} {'needed' if need else 'skipped by changes':18} {result}")
              if not ok:
                  bad.append(job)
          if bad:
              sys.exit(f"not passed: {', '.join(bad)}")
          PY
