name: Release

# Publishes the two container images to Docker Hub.
#
#   push to main   → :edge            (moving, tracks the default branch)
#   tag v1.2.3     → :1.2.3 :1.2 :latest
#
# Requires two repository secrets, both under Settings → Secrets and variables
# → Actions:
#
#   DOCKERHUB_USERNAME  the Docker Hub account that owns the repositories
#   DOCKERHUB_TOKEN     an access token with Read & Write scope
#
# The account name doubles as the image namespace, so a fork publishes to its
# own namespace without editing this file.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
            image: kchat-api
          - name: web
            context: apps/web
            image: kchat-web
    steps:
      # A fork inherits this workflow but not the secrets. Checking first turns
      # an opaque "unauthorized: incorrect username or password" from the
      # registry into a message that says what to configure.
      - name: Check registry credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set." \
                 "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v7

      # arm64 is emulated. Neither image compiles anything from source — the
      # Python dependencies resolve to manylinux aarch64 wheels and the web
      # image only runs a bundler — so the emulated leg costs minutes, not the
      # tens of minutes a source build would.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=kchat-${{ matrix.name }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,scope=release-${{ matrix.name }},mode=max

      # Docker Hub shows the repository README from the registry, not from git.
      # Without this step the listing page stays empty however good the README
      # in the repository is.
      - name: Sync Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          short-description: 'kchat ${{ matrix.name }} — open-source generative AI workspace'
          readme-filepath: README.md
