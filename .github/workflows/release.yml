name: Release

# Publishes the container images to Docker Hub.
#
#   push to main   → :latest
#   tag v1.2.3     → :1.2.3 :1.2 :latest
#   tag v1.2.3-rc1 → :1.2.3-rc1        (a prerelease never moves :latest)
#
# On a push, only the images whose sources changed are rebuilt (`changes`).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#
#   DOCKERHUB_USERNAME  Docker Hub account; doubles as the image namespace
#   DOCKERHUB_TOKEN     access token with Read & Write scope
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Image · detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      # Full history: the diff base is not in a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          build_all() {
            echo "$1"
            {
              echo 'matrix={"include":[{"name":"api","context":"apps/api","image":"kloudchat-api"},{"name":"print","context":"apps/print","image":"kloudchat-print"},{"name":"web","context":"apps/web","image":"kloudchat-web"}]}'
              echo 'any=true'
            } >> "$GITHUB_OUTPUT"
          }

          # A tag or a manual run publishes everything: a release leaves a
          # complete set of tags.
          case "$REF" in refs/tags/*) build_all "tag build — publishing all"; exit 0 ;; esac
          if [ "$EVENT" != "push" ]; then
            build_all "$EVENT — publishing all"; exit 0
          fi

          # No usable base: new branch, first commit, or force push.
          if [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            build_all "no diff base — publishing all"; exit 0
          fi

          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          # A change to this workflow rebuilds everything.
          if echo "$changed" | grep -qx '.github/workflows/release.yml'; then
            build_all "release.yml changed — publishing all"; exit 0
          fi

          entries=""
          if echo "$changed" | grep -q '^apps/api/'; then
            entries='{"name":"api","context":"apps/api","image":"kloudchat-api"}'
          fi
          if echo "$changed" | grep -q '^apps/print/'; then
            [ -n "$entries" ] && entries="$entries,"
            entries="$entries{\"name\":\"print\",\"context\":\"apps/print\",\"image\":\"kloudchat-print\"}"
          fi
          if echo "$changed" | grep -q '^apps/web/'; then
            [ -n "$entries" ] && entries="$entries,"
            entries="$entries{\"name\":\"web\",\"context\":\"apps/web\",\"image\":\"kloudchat-web\"}"
          fi

          if [ -z "$entries" ]; then
            echo "No image sources changed — nothing to publish."
            { echo 'matrix={"include":[]}'; echo 'any=false'; } >> "$GITHUB_OUTPUT"
          else
            echo "Publishing: $entries"
            { echo "matrix={\"include\":[$entries]}"; echo 'any=true'; } >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Image · publish ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      # A fork inherits the workflow but not the secrets; say what to configure.
      - name: Check registry credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set." \
                 "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v7

      # arm64 is emulated. No image compiles from source (manylinux wheels;
      # the web bundle is built on the build host), so the leg costs minutes.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          # `latest=auto`: a version tag moves `latest`, a prerelease does not.
          # The raw rule adds it for pushes to main.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=kloudchat-${{ matrix.name }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,scope=release-${{ matrix.name }},mode=max

      # Docker Hub shows the README from the registry, not from git.
      - name: Sync Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          short-description: 'KloudChat ${{ matrix.name }} — open-source generative AI workspace'
          readme-filepath: README.md
