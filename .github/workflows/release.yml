name: Release

# Publishes the container images to Docker Hub.
#
#   push to main   → :latest
#   tag v1.2.3     → :1.2.3 :1.2 :latest
#   tag v1.2.3-rc1 → :1.2.3-rc1        (a prerelease never moves :latest)
#
# Only the images whose sources changed are rebuilt — see the `changes` job.
#
# Requires two repository secrets, both under Settings → Secrets and variables
# → Actions:
#
#   DOCKERHUB_USERNAME  the Docker Hub account that owns the repositories
#   DOCKERHUB_TOKEN     an access token with Read & Write scope
#
# The account name doubles as the image namespace, so a fork publishes to its
# own namespace without editing this file.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Image · detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      # Full history: the diff base is the previous tip of the branch, which a
      # shallow clone does not contain.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          build_all() {
            echo "$1"
            {
              echo 'matrix={"include":[{"name":"api","context":"apps/api","image":"kloudchat-api"},{"name":"web","context":"apps/web","image":"kloudchat-web"}]}'
              echo 'any=true'
            } >> "$GITHUB_OUTPUT"
          }

          # A tag or a manual run publishes everything. A release has to leave a
          # complete set of tags behind: skipping the image that happened not to
          # change would mean no kloudchat-web:1.2.3 exists at all.
          case "$REF" in refs/tags/*) build_all "tag build — publishing both"; exit 0 ;; esac
          if [ "$EVENT" != "push" ]; then
            build_all "$EVENT — publishing both"; exit 0
          fi

          # No usable base: a new branch, the first commit, or a force push that
          # removed the previous tip. Publish both rather than guess.
          if [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            build_all "no diff base — publishing both"; exit 0
          fi

          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          # A change to this workflow rebuilds both, so the change is exercised
          # on the path it affects.
          if echo "$changed" | grep -qx '.github/workflows/release.yml'; then
            build_all "release.yml changed — publishing both"; exit 0
          fi

          entries=""
          if echo "$changed" | grep -q '^apps/api/'; then
            entries='{"name":"api","context":"apps/api","image":"kloudchat-api"}'
          fi
          if echo "$changed" | grep -q '^apps/web/'; then
            [ -n "$entries" ] && entries="$entries,"
            entries="$entries{\"name\":\"web\",\"context\":\"apps/web\",\"image\":\"kloudchat-web\"}"
          fi

          if [ -z "$entries" ]; then
            echo "No image sources changed — nothing to publish."
            { echo 'matrix={"include":[]}'; echo 'any=false'; } >> "$GITHUB_OUTPUT"
          else
            echo "Publishing: $entries"
            { echo "matrix={\"include\":[$entries]}"; echo 'any=true'; } >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Image · publish ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      # A fork inherits this workflow but not the secrets. Checking first turns
      # an opaque "unauthorized: incorrect username or password" from the
      # registry into a message that says what to configure.
      - name: Check registry credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set." \
                 "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v7

      # arm64 is emulated. Neither image compiles anything from source — the
      # Python dependencies resolve to manylinux aarch64 wheels and the web
      # image only runs a bundler — so the emulated leg costs minutes, not the
      # tens of minutes a source build would.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          # `latest=auto` is what puts `latest` on a version tag, and it skips
          # prereleases: `v1.2.3` moves `latest`, `v1.2.3-rc1` does not. The raw
          # rule below adds it for pushes to main, so `latest` always points at
          # whichever of the two ran most recently.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=kloudchat-${{ matrix.name }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,scope=release-${{ matrix.name }},mode=max

      # Docker Hub shows the repository README from the registry, not from git.
      # Without this step the listing page stays empty however good the README
      # in the repository is.
      - name: Sync Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          short-description: 'KloudChat ${{ matrix.name }} — open-source generative AI workspace'
          readme-filepath: README.md
