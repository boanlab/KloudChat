# Development overlay — the web app from Vite with HMR instead of the built
# bundle. Same service name, so ports and URLs match production.
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.build.yml \
#                  -f docker-compose.dev.yml up -d
services:
  web:
    # Vite runs off the mounted tree; nothing is built for this service.
    build: !reset null
    image: node:22-alpine
    pull_policy: missing
    working_dir: /app
    command: [node, node_modules/vite/bin/vite.js, --host, 0.0.0.0, --port, '5173']
    environment:
      # Vite's dev proxy forwards /api in place of nginx.
      API_BASE_URL: ${KCHAT_API_URL:-http://kloudchat-api:8100}
      # Comma-separated Host headers Vite will answer to; needed behind a
      # reverse proxy. `KCHAT_WEB_HOST=kchat.example.org make dev`.
      WEB_ALLOWED_HOSTS: ${KCHAT_WEB_HOST:-}
    volumes:
      - ./apps/web:/app
    ports: !override
      - "${KCHAT_WEB_PORT:-5173}:5173"
