# Development overlay — serves the web app from Vite instead of a built bundle.
#
# The web image contains compiled static files, so editing source has no effect
# on it. Here the source tree is mounted and HMR does the work. The service name
# is unchanged, so ports and URLs match production; the only difference is what
# is listening.
#
# Layer it over the build overlay, so the API also comes from this checkout:
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.build.yml \
#                  -f docker-compose.dev.yml up -d
services:
  web:
    # Nothing is built for the web service here, whether or not the build
    # overlay is also in play — this container runs Vite off the mounted tree.
    build: !reset null
    image: node:22-alpine
    pull_policy: missing
    working_dir: /app
    command: [node, node_modules/vite/bin/vite.js, --host, 0.0.0.0, --port, '5173']
    environment:
      # Vite's dev proxy forwards /api in place of nginx.
      API_BASE_URL: ${KCHAT_API_URL:-http://kloudchat-api:8100}
      # Hostnames the dev server will answer to, comma-separated. Needed when
      # this overlay sits behind a proxy: the built image serves static files
      # and does not care, while Vite refuses a Host header it was not told
      # about. Set `KCHAT_WEB_HOST=kchat.example.org` before `make dev`.
      WEB_ALLOWED_HOSTS: ${KCHAT_WEB_HOST:-}
    volumes:
      - ./apps/web:/app
    ports: !override
      - "${KCHAT_WEB_PORT:-5173}:5173"
